<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" width="720" height="312" style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace"><rect x="1" y="1" width="714" height="306" fill="#fafaf6" stroke="#0f1115" stroke-width="1.5"/><text x="16" y="24" font-size="11.5" font-weight="800" letter-spacing="1.4" fill="#0f1115">FIG. 2   YOUR HEART-RATE ZONES</text><line x1="16" x2="704" y1="34" y2="34" stroke="#0f1115"/><text x="16.0" y="64.0" font-size="12.5" font-weight="400" fill="#0f1115" text-anchor="start">max heart rate</text><rect x="130.39999999999998" y="48" width="64" height="24" fill="#fafaf6" stroke="#0f1115"/><text x="138.4" y="64.0" font-size="12.5" font-weight="400" fill="#0f1115" text-anchor="start">180</text><text x="202.4" y="64.0" font-size="12" font-weight="400" fill="#0f1115" text-anchor="start">bpm</text><text x="243.2" y="64.0" font-size="12.5" font-weight="400" fill="#0f1115" text-anchor="start">or age</text><rect x="296.79999999999995" y="48" width="64" height="24" fill="#fafaf6" stroke="#0f1115"/><text x="304.8" y="64.0" font-size="12.5" font-weight="400" fill="#0f1115" text-anchor="start"></text><text x="378.8" y="64.0" font-size="12.5" font-weight="400" fill="#0f1115" text-anchor="start">a run's average</text><rect x="500.79999999999995" y="48" width="64" height="24" fill="#fafaf6" stroke="#0f1115"/><text x="508.8" y="64.0" font-size="12.5" font-weight="400" fill="#0f1115" text-anchor="start">140</text><text x="572.8" y="64.0" font-size="12" font-weight="400" fill="#0f1115" text-anchor="start">bpm</text><rect x="16" y="88" width="682" height="28" fill="#f1f1ed"/><rect x="16" y="88" width="3" height="28" fill="#0f1115"/><text x="28.0" y="106.0" font-size="12" font-weight="400" fill="#0f1115" text-anchor="start">A run at <tspan font-weight="800">140 bpm</tspan> is <tspan font-weight="800" fill="#7127a0">zone 2</tspan> for a max of 180.</text><text x="16.0" y="142.0" font-size="11" font-weight="800" fill="#0f1115" text-anchor="start">ZONE</text><text x="80.0" y="142.0" font-size="11" font-weight="800" fill="#0f1115" text-anchor="start">BPM</text><text x="190.0" y="142.0" font-size="11" font-weight="800" fill="#0f1115" text-anchor="start">EFFORT</text><line x1="16" x2="698" y1="148" y2="148" stroke="#0f1115" stroke-width="1.5"/><text x="16.0" y="166.0" font-size="12" font-weight="800" fill="#0f1115" text-anchor="start">1</text><text x="80.0" y="166.0" font-size="12" font-weight="800" fill="#6b4526" text-anchor="start">90–117</text><text x="190.0" y="166.0" font-size="12" font-weight="400" fill="#0f1115" text-anchor="start">breathing easily, full sentences</text><line x1="16" x2="698" y1="174" y2="174" stroke="#c3c5cb"/><rect x="16" y="174" width="682" height="24" fill="#eddcf7"/><text x="16.0" y="190.0" font-size="12" font-weight="800" fill="#0f1115" text-anchor="start">2</text><text x="80.0" y="190.0" font-size="12" font-weight="800" fill="#6b4526" text-anchor="start">118–144</text><text x="190.0" y="190.0" font-size="12" font-weight="400" fill="#0f1115" text-anchor="start">easy to steady, complete sentences</text><line x1="16" x2="698" y1="198" y2="198" stroke="#c3c5cb"/><text x="16.0" y="214.0" font-size="12" font-weight="800" fill="#0f1115" text-anchor="start">3</text><text x="80.0" y="214.0" font-size="12" font-weight="800" fill="#6b4526" text-anchor="start">145–153</text><text x="190.0" y="214.0" font-size="12" font-weight="400" fill="#0f1115" text-anchor="start">moderate, winded if you talk</text><line x1="16" x2="698" y1="222" y2="222" stroke="#c3c5cb"/><text x="16.0" y="238.0" font-size="12" font-weight="800" fill="#0f1115" text-anchor="start">4</text><text x="80.0" y="238.0" font-size="12" font-weight="800" fill="#6b4526" text-anchor="start">154–165</text><text x="190.0" y="238.0" font-size="12" font-weight="400" fill="#0f1115" text-anchor="start">threshold, clipped sentences, about an hour</text><line x1="16" x2="698" y1="246" y2="246" stroke="#c3c5cb"/><text x="16.0" y="262.0" font-size="12" font-weight="800" fill="#0f1115" text-anchor="start">5</text><text x="80.0" y="262.0" font-size="12" font-weight="800" fill="#6b4526" text-anchor="start">166–180</text><text x="190.0" y="262.0" font-size="12" font-weight="400" fill="#0f1115" text-anchor="start">hard intervals to all-out sprints</text><line x1="16" x2="698" y1="270" y2="270" stroke="#c3c5cb"/><rect x="16" y="289" width="18" height="10" fill="#f4e3d0" stroke="#6b4526"/><text x="40.0" y="298.0" font-size="10.5" font-weight="400" fill="#4a4d55" text-anchor="start">your zones in bpm</text><rect x="164.8" y="289" width="18" height="10" fill="#eddcf7" stroke="#7127a0"/><text x="188.8" y="298.0" font-size="10.5" font-weight="400" fill="#4a4d55" text-anchor="start">the zone of your run</text></svg>