<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace"><rect x="1" y="1" width="714" height="324" fill="#fafaf6" stroke="#0f1115" stroke-width="1.5"/><text x="16" y="24" font-size="11.5" font-weight="800" letter-spacing="1.4" fill="#0f1115">FIG. 3   YOUR HEART-RATE ZONES</text><line x1="16" x2="704" y1="34" y2="34" stroke="#0f1115"/><text x="16.0" y="58.0" font-size="12.5" font-weight="800" fill="#0f1115" text-anchor="start">Max heart rate 180 bpm · a run at 140 bpm</text><rect x="16" y="70" width="207.84615384615387" height="26" fill="#f4e3d0"/><text x="119.9" y="87.0" font-size="11" font-weight="800" fill="#0f1115" text-anchor="middle">Z1</text><rect x="225.84615384615387" y="70" width="200.35164835164835" height="26" fill="#cbb49d"/><text x="326.0" y="87.0" font-size="11" font-weight="800" fill="#0f1115" text-anchor="middle">Z2</text><rect x="428.1978021978022" y="70" width="65.45054945054945" height="26" fill="#a98c72"/><text x="460.9" y="87.0" font-size="11" font-weight="800" fill="#fafaf6" text-anchor="middle">Z3</text><rect x="495.64835164835165" y="70" width="87.93406593406594" height="26" fill="#89684b"/><text x="539.6" y="87.0" font-size="11" font-weight="800" fill="#fafaf6" text-anchor="middle">Z4</text><rect x="585.5824175824176" y="70" width="110.41758241758241" height="26" fill="#6b4526"/><text x="640.8" y="87.0" font-size="11" font-weight="800" fill="#fafaf6" text-anchor="middle">Z5</text><rect x="391.9725274725275" y="64" width="5" height="38" fill="#7127a0" stroke="#fafaf6" stroke-width="2"/><rect x="16" y="110" width="682" height="28" fill="#f1f1ed"/><rect x="16" y="110" width="3" height="28" fill="#0f1115"/><text x="28.0" y="128.0" font-size="12" font-weight="400" fill="#0f1115" text-anchor="start">A run at <tspan font-weight="800">140 bpm</tspan> is <tspan font-weight="800" fill="#7127a0">zone 2</tspan> for a max of 180: easy to steady, complete sentences.</text><text x="16.0" y="162.0" font-size="11" font-weight="800" fill="#0f1115" text-anchor="start">ZONE</text><text x="80.0" y="162.0" font-size="11" font-weight="800" fill="#0f1115" text-anchor="start">BPM</text><text x="190.0" y="162.0" font-size="11" font-weight="800" fill="#0f1115" text-anchor="start">EFFORT</text><line x1="16" x2="698" y1="168" y2="168" stroke="#0f1115" stroke-width="1.5"/><text x="16.0" y="186.0" font-size="12" font-weight="800" fill="#0f1115" text-anchor="start">1</text><text x="80.0" y="186.0" font-size="12" font-weight="800" fill="#6b4526" text-anchor="start">90–117</text><text x="190.0" y="186.0" font-size="12" font-weight="400" fill="#0f1115" text-anchor="start">breathing easily, full sentences</text><line x1="16" x2="698" y1="194" y2="194" stroke="#c3c5cb"/><rect x="16" y="194" width="682" height="24" fill="#eddcf7"/><text x="16.0" y="210.0" font-size="12" font-weight="800" fill="#0f1115" text-anchor="start">2</text><text x="80.0" y="210.0" font-size="12" font-weight="800" fill="#6b4526" text-anchor="start">118–144</text><text x="190.0" y="210.0" font-size="12" font-weight="400" fill="#0f1115" text-anchor="start">easy to steady, complete sentences</text><line x1="16" x2="698" y1="218" y2="218" stroke="#c3c5cb"/><text x="16.0" y="234.0" font-size="12" font-weight="800" fill="#0f1115" text-anchor="start">3</text><text x="80.0" y="234.0" font-size="12" font-weight="800" fill="#6b4526" text-anchor="start">145–153</text><text x="190.0" y="234.0" font-size="12" font-weight="400" fill="#0f1115" text-anchor="start">moderate, winded if you talk</text><line x1="16" x2="698" y1="242" y2="242" stroke="#c3c5cb"/><text x="16.0" y="258.0" font-size="12" font-weight="800" fill="#0f1115" text-anchor="start">4</text><text x="80.0" y="258.0" font-size="12" font-weight="800" fill="#6b4526" text-anchor="start">154–165</text><text x="190.0" y="258.0" font-size="12" font-weight="400" fill="#0f1115" text-anchor="start">threshold, clipped sentences, about an hour</text><line x1="16" x2="698" y1="266" y2="266" stroke="#c3c5cb"/><text x="16.0" y="282.0" font-size="12" font-weight="800" fill="#0f1115" text-anchor="start">5</text><text x="80.0" y="282.0" font-size="12" font-weight="800" fill="#6b4526" text-anchor="start">166–180</text><text x="190.0" y="282.0" font-size="12" font-weight="400" fill="#0f1115" text-anchor="start">hard intervals to all-out sprints</text><line x1="16" x2="698" y1="290" y2="290" stroke="#c3c5cb"/><rect x="16" y="307" width="18" height="10" fill="#f4e3d0" stroke="#6b4526"/><text x="40.0" y="316.0" font-size="10.5" font-weight="400" fill="#4a4d55" text-anchor="start">zone 1</text><rect x="94.4" y="307" width="18" height="10" fill="#a98c72" stroke="#6b4526"/><text x="118.4" y="316.0" font-size="10.5" font-weight="400" fill="#4a4d55" text-anchor="start">zone 3</text><rect x="172.8" y="307" width="18" height="10" fill="#6b4526" stroke="#6b4526"/><text x="196.8" y="316.0" font-size="10.5" font-weight="400" fill="#4a4d55" text-anchor="start">zone 5</text><rect x="251.20000000000002" y="307" width="18" height="10" fill="#eddcf7" stroke="#7127a0"/><text x="275.2" y="316.0" font-size="10.5" font-weight="400" fill="#4a4d55" text-anchor="start">your run</text></svg>