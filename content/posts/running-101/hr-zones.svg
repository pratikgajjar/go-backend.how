<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 266" width="720" height="266" style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace"><rect width="720" height="266" fill="#d6f0de"/><text x="20.0" y="24.0" font-size="12" font-weight="800" fill="#17291e" text-anchor="start">HEART-RATE ZONES · MAX 180 BPM · A 140 BPM RUN</text><rect x="20" y="40" width="207.23076923076925" height="28" fill="#bfd8c7"/><text x="123.6" y="58.0" font-size="11" font-weight="700" fill="#17291e" text-anchor="middle">Z1</text><rect x="229.23076923076925" y="40" width="199.75824175824175" height="28" fill="#9db4a4"/><text x="329.1" y="58.0" font-size="11" font-weight="700" fill="#17291e" text-anchor="middle">Z2</text><rect x="430.98901098901104" y="40" width="65.25274725274726" height="28" fill="#768c7e"/><text x="463.6" y="58.0" font-size="11" font-weight="700" fill="#d6f0de" text-anchor="middle">Z3</text><rect x="498.2417582417583" y="40" width="87.67032967032968" height="28" fill="#4c6154"/><text x="542.1" y="58.0" font-size="11" font-weight="700" fill="#d6f0de" text-anchor="middle">Z4</text><rect x="587.9120879120879" y="40" width="110.08791208791209" height="28" fill="#17291e"/><text x="643.0" y="58.0" font-size="11" font-weight="700" fill="#d6f0de" text-anchor="middle">Z5</text><rect x="395.3626373626374" y="34" width="4" height="40" fill="#17291e" stroke="#d6f0de" stroke-width="2"/><rect x="30" y="89" width="12" height="12" fill="#bfd8c7" stroke="#17291e"/><text x="52.0" y="100.0" font-size="13" font-weight="700" fill="#17291e" text-anchor="start">Zone 1</text><text x="140.0" y="100.0" font-size="13" font-weight="400" fill="#17291e" text-anchor="start">90–117 bpm</text><text x="260.0" y="100.0" font-size="13" font-weight="400" fill="#17291e" text-anchor="start">breathing easily, full sentences</text><line x1="20" x2="700" y1="108" y2="108" stroke="#9fb8a7"/><rect x="20" y="110" width="680" height="26" fill="#c3e3cd"/><rect x="20" y="110" width="4" height="26" fill="#17291e"/><rect x="30" y="117" width="12" height="12" fill="#9db4a4" stroke="#17291e"/><text x="52.0" y="128.0" font-size="13" font-weight="700" fill="#17291e" text-anchor="start">Zone 2</text><text x="140.0" y="128.0" font-size="13" font-weight="400" fill="#17291e" text-anchor="start">118–144 bpm</text><text x="260.0" y="128.0" font-size="13" font-weight="400" fill="#17291e" text-anchor="start">easy to steady, complete sentences</text><line x1="20" x2="700" y1="136" y2="136" stroke="#9fb8a7"/><rect x="30" y="145" width="12" height="12" fill="#768c7e" stroke="#17291e"/><text x="52.0" y="156.0" font-size="13" font-weight="700" fill="#17291e" text-anchor="start">Zone 3</text><text x="140.0" y="156.0" font-size="13" font-weight="400" fill="#17291e" text-anchor="start">145–153 bpm</text><text x="260.0" y="156.0" font-size="13" font-weight="400" fill="#17291e" text-anchor="start">moderate, winded if you talk</text><line x1="20" x2="700" y1="164" y2="164" stroke="#9fb8a7"/><rect x="30" y="173" width="12" height="12" fill="#4c6154" stroke="#17291e"/><text x="52.0" y="184.0" font-size="13" font-weight="700" fill="#17291e" text-anchor="start">Zone 4</text><text x="140.0" y="184.0" font-size="13" font-weight="400" fill="#17291e" text-anchor="start">154–165 bpm</text><text x="260.0" y="184.0" font-size="13" font-weight="400" fill="#17291e" text-anchor="start">threshold, clipped sentences, about an hour</text><line x1="20" x2="700" y1="192" y2="192" stroke="#9fb8a7"/><rect x="30" y="201" width="12" height="12" fill="#17291e" stroke="#17291e"/><text x="52.0" y="212.0" font-size="13" font-weight="700" fill="#17291e" text-anchor="start">Zone 5</text><text x="140.0" y="212.0" font-size="13" font-weight="400" fill="#17291e" text-anchor="start">166–180 bpm</text><text x="260.0" y="212.0" font-size="13" font-weight="400" fill="#17291e" text-anchor="start">hard intervals to all-out sprints</text><line x1="20" x2="700" y1="220" y2="220" stroke="#9fb8a7"/><text x="20.0" y="254.0" font-size="12.5" font-weight="400" fill="#17291e" text-anchor="start">A run at 140 bpm is zone 2 for a max of 180: easy to steady, complete sentences.</text></svg>