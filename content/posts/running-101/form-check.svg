<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" width="720" height="456" style="font-family:'JetBrains Mono',ui-monospace,Menlo,monospace"><rect x="1" y="1" width="714" height="450" fill="#fafaf6" stroke="#0f1115" stroke-width="1.5"/><text x="16" y="24" font-size="11.5" font-weight="800" letter-spacing="1.4" fill="#0f1115">FIG. 1   WHERE YOUR FORM SITS</text><line x1="16" x2="704" y1="34" y2="34" stroke="#0f1115"/><text x="16.0" y="58.0" font-size="13" font-weight="800" fill="#0f1115" text-anchor="start">I started at 120 steps a minute. Where does that sit among runners?</text><rect x="16" y="70" width="682" height="30" fill="#f6dcd8"/><rect x="16" y="70" width="4" height="30" fill="#c0302b"/><text x="28.0" y="90.0" font-size="12" font-weight="400" fill="#0f1115" text-anchor="start">120 spm is in the bottom 5%: more than 95% of runners take more steps a minute.</text><text x="16.0" y="143.0" font-size="12.5" font-weight="400" fill="#0f1115" text-anchor="start">Cadence</text><rect x="79.19999999999999" y="128" width="70" height="22" fill="#fafaf6" stroke="#0f1115"/><text x="87.2" y="143.0" font-size="12.5" font-weight="400" fill="#0f1115" text-anchor="start">120</text><text x="159.2" y="143.0" font-size="12" font-weight="400" fill="#0f1115" text-anchor="start">spm</text><rect x="608" y="131" width="88" height="16" fill="none" stroke="#c0302b"/><text x="652.0" y="143.0" font-size="10" font-weight="800" fill="#c0302b" text-anchor="middle">START HERE</text><rect x="16" y="160" width="32.1" height="10" fill="#c0302b"/><rect x="50.1" y="160" width="168.5" height="10" fill="#f6dcd8"/><rect x="220.6" y="160" width="270.8" height="10" fill="#e6e6e1"/><rect x="493.4" y="160" width="168.5" height="10" fill="#cdeed8"/><rect x="663.9" y="160" width="32.1" height="10" fill="#11663b"/><rect x="17.41" y="154" width="4" height="22" fill="#0f1115" stroke="#fafaf6" stroke-width="2"/><text x="16.0" y="188.0" font-size="12" font-weight="800" fill="#0f1115" text-anchor="sta