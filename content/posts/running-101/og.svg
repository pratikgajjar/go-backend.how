<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); } .done-t { fill: var(--green); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .done { fill: var(--green-l); stroke: var(--green); stroke-width: 2.5; }
    .next { fill: var(--board); stroke: var(--ink); stroke-width: 2; stroke-dasharray: 7 5; }
    .axis { stroke: var(--ink); stroke-width: 2.5; }
    .pp { fill: var(--purple); }
    text { font-family: var(--font-mono); }
  </style>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1096" height="526" class="ink"/>
  <rect x="48" y="48" width="1096" height="526" class="box"/>

  <text x="96" y="112" font-size="24" class="mute">backend.how</text>
  <text x="96" y="186" font-size="58" font-weight="800" class="ink">Running 101</text>
  <text x="96" y="252" font-size="34" font-weight="600" class="ink">From a 38-min 4K</text>
  <text x="96" y="300" font-size="34" font-weight="600" class="ink">to a 24:45 5K</text>

  <text x="96" y="468" font-size="26" class="ink">One goal at a time,</text>
  <text x="96" y="504" font-size="26" class="ink">one metric at a time.</text>

  <!-- 5K goals in order; bar height = goal time (7 px per minute) -->
  <text x="620" y="168" font-size="22" class="mute">5K goals, minutes</text>
  <g font-size="26" font-weight="700" text-anchor="middle">
    <rect x="620" y="225" width="100" height="245" class="done"/><text x="670" y="212" class="ink">~35</text>
    <rect x="744" y="260" width="100" height="210" class="done"/><text x="794" y="247" class="ink">&lt;30</text>
    <rect x="868" y="295" width="100" height="175" class="done"/><text x="918" y="282" class="pp">24:45</text>
    <rect x="992" y="330" width="100" height="140" class="next"/><text x="1042" y="317" class="mute">&lt;20</text>
  </g>
  <line x1="608" y1="470" x2="1104" y2="470" class="axis"/>
  <g font-size="22" text-anchor="middle">
    <text x="670"  y="504" class="mute">Oct</text>
    <text x="794"  y="504" class="mute">Nov</text>
    <text x="918"  y="504" class="mute">Dec</text>
    <text x="1042" y="504" class="mute">next</text>
  </g>
</svg>
