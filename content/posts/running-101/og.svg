<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .done { fill: var(--green-l); stroke: var(--green); stroke-width: 2.5; }
    .next { fill: var(--board); stroke: var(--ink); stroke-width: 2; stroke-dasharray: 7 5; }
    .axis { stroke: var(--ink); stroke-width: 2.5; }
    .pp { fill: var(--purple); }
    text { font-family: var(--font-mono); }
  </style>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1104" height="526" class="ink"/>
  <rect x="48" y="48" width="1104" height="526" class="box"/>

  <text x="96" y="120" font-size="28" class="mute">backend.how</text>
  <text x="96" y="198" font-size="58" font-weight="800" class="ink">Running 101</text>
  <text x="96" y="266" font-size="34" font-weight="600" class="ink">From a 38-min 4K</text>
  <text x="96" y="314" font-size="34" font-weight="600" class="ink">to a 24:45 5K</text>

  <text x="96" y="470" font-size="30" class="ink">One goal at a time,</text>
  <text x="96" y="512" font-size="30" class="ink">one metric at a time.</text>

  <!-- 5K goal times in minutes, in order; bar height = goal time (7 px per minute) -->
  <g font-size="32" font-weight="700" text-anchor="middle">
    <rect x="608" y="225" width="110" height="245" class="done"/><text x="663" y="210" class="ink">~35</text>
    <rect x="734" y="260" width="110" height="210" class="done"/><text x="789" y="245" class="ink">&lt;30</text>
    <rect x="860" y="295" width="110" height="175" class="done"/><text x="915" y="280" class="pp">24:45</text>
    <rect x="986" y="330" width="110" height="140" class="next"/><text x="1041" y="315" class="mute">&lt;20</text>
  </g>
  <line x1="596" y1="470" x2="1104" y2="470" class="axis"/>
  <g font-size="28" text-anchor="middle">
    <text x="663"  y="512" class="mute">Oct</text>
    <text x="789"  y="512" class="mute">Nov</text>
    <text x="915"  y="512" class="mute">Dec</text>
    <text x="1041" y="512" class="mute">next</text>
  </g>
</svg>
