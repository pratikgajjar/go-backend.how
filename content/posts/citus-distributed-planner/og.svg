<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .sql { fill: var(--brown-l); stroke: var(--brown); stroke-width: 2.5; stroke-dasharray: 8 5; }
    .path { fill: var(--board); stroke: var(--ink); stroke-width: 2; }
    .pick { fill: var(--orange-l); stroke: var(--orange); stroke-width: 3; }
    .wire { stroke: var(--ink); stroke-width: 2; fill: none; }
    .hot { stroke: var(--orange); stroke-width: 4; fill: none; }
    .head { fill: var(--ink); } .hhead { fill: var(--orange); }
    text { font-family: var(--font-mono); }
  </style>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1096" height="526" class="ink"/>
  <rect x="48" y="48" width="1096" height="526" class="box"/>

  <text x="96" y="112" font-size="24" class="mute">backend.how</text>
  <text x="96" y="186" font-size="58" font-weight="800" class="ink">Citus Distributed Planner</text>
  <text x="96" y="244" font-size="34" font-weight="600" class="ink">The 4 SQL transforms it does</text>

  <!-- one SQL query (data) goes into the planner (process) -->
  <rect x="96" y="356" width="196" height="100" class="sql"/>
  <text x="194" y="397" font-size="24" text-anchor="middle" class="ink">SQL</text>
  <text x="194" y="430" font-size="22" text-anchor="middle" class="mute">WHERE key=42</text>
  <line x1="292" y1="406" x2="334" y2="406" class="wire"/>
  <path d="M346 406 l-14 -8 v16 z" class="head"/>

  <rect x="348" y="356" width="176" height="100" class="box"/>
  <text x="436" y="397" font-size="24" font-weight="700" text-anchor="middle" class="ink">planner</text>
  <text x="436" y="430" font-size="22" text-anchor="middle" class="mute">prune</text>

  <!-- fan out to the four paths, cheapest first -->
  <path d="M524 406 C 576 406, 576 315, 620 315" class="hot"/>
  <path d="M636 315 l-18 -10 v20 z" class="hhead"/>
  <path d="M524 406 C 580 406, 580 375, 624 375" class="wire"/>
  <path d="M524 406 C 580 406, 580 435, 624 435" class="wire"/>
  <path d="M524 406 C 580 406, 580 495, 624 495" class="wire"/>

  <text x="96" y="503" font-size="22" class="mute">cheap at top, costly at bottom</text>

  <g font-size="24">
    <rect x="640" y="292" width="464" height="46" class="pick"/>
    <text x="656" y="323" class="ink" font-weight="700">fast-path router</text>
    <text x="1088" y="323" text-anchor="end" class="ink">1 shard</text>

    <rect x="640" y="352" width="464" height="46" class="path"/>
    <text x="656" y="383" class="ink">router modify</text>
    <text x="1088" y="383" text-anchor="end" class="mute">N shards</text>

    <rect x="640" y="412" width="464" height="46" class="path"/>
    <text x="656" y="443" class="ink">multi-shard SELECT</text>
    <text x="1088" y="443" text-anchor="end" class="mute">split agg</text>

    <rect x="640" y="472" width="464" height="46" class="path"/>
    <text x="656" y="503" class="ink">repartition</text>
    <text x="1088" y="503" text-anchor="end" class="mute">shuffle</text>
  </g>
</svg>
