<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .red { fill: var(--red); } .pur { fill: var(--purple); }
    .all { fill: var(--red-l); stroke: var(--red); stroke-width: 2.5; stroke-dasharray: 8 5; }
    .allg { fill: none; stroke: var(--red); stroke-opacity: 0.3; stroke-width: 1.5; }
    .tbl { fill: var(--board); stroke: var(--ink); stroke-width: 2; stroke-dasharray: 8 5; }
    .tblg { fill: none; stroke: var(--line); stroke-width: 1.5; }
    .hit { fill: var(--purple-l); stroke: var(--purple); stroke-width: 3; }
    .cell { fill: var(--purple); }
    .path { fill: none; stroke: var(--purple); stroke-width: 3.5; }
    .lab { fill: var(--board); }
    text { font-family: var(--font-mono); }
  </style>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1096" height="526" class="ink"/>
  <rect x="48" y="48" width="1096" height="526" class="box"/>

  <text x="96" y="118" font-size="28" class="mute">backend.how</text>
  <text x="96" y="192" font-size="58" font-weight="800" class="ink">Postgres - Optimising query</text>

  <!-- left: no index, the sequential scan reads every page of users -->
  <text x="96" y="266" font-size="28" font-weight="700" class="red">No index: 33,333 pages</text>
  <rect x="96" y="290" width="432" height="180" class="all"/>
  <path d="M120 290 V470 M144 290 V470 M168 290 V470 M192 290 V470 M216 290 V470 M240 290 V470 M264 290 V470 M288 290 V470 M312 290 V470 M336 290 V470 M360 290 V470 M384 290 V470 M408 290 V470 M432 290 V470 M456 290 V470 M480 290 V470 M504 290 V470 M96 314 H528 M96 338 H528 M96 362 H528 M96 386 H528 M96 410 H528 M96 434 H528 M96 458 H528" class="allg"/>
  <rect x="168" y="358" width="288" height="44" class="lab"/>
  <text x="312" y="390" font-size="28" text-anchor="middle" class="ink">every table page</text>

  <!-- right: B-tree root, branch, leaf, then one table page -->
  <text x="608" y="266" font-size="28" font-weight="700" class="pur">Index: 4 pages</text>
  <g font-size="28">
    <rect x="608" y="290" width="164" height="52" class="hit"/><text x="622" y="326" class="ink">1 root</text>
    <rect x="608" y="354" width="164" height="52" class="hit"/><text x="622" y="390" class="ink">2 branch</text>
    <rect x="608" y="418" width="164" height="52" class="hit"/><text x="622" y="454" class="ink">3 leaf</text>
  </g>
  <path d="M690 342 V354 M690 406 V418" class="path"/>
  <rect x="804" y="290" width="292" height="180" class="tbl"/>
  <path d="M828 290 V470 M852 290 V470 M876 290 V470 M900 290 V470 M924 290 V470 M948 290 V470 M972 290 V470 M996 290 V470 M1020 290 V470 M1044 290 V470 M1068 290 V470 M804 314 H1096 M804 338 H1096 M804 362 H1096 M804 386 H1096 M804 410 H1096 M804 434 H1096 M804 458 H1096" class="tblg"/>
  <path d="M772 446 H972" class="path"/>
  <rect x="972" y="434" width="24" height="24" class="cell"/>
  <rect x="1000" y="426" width="34" height="40" class="lab"/>
  <text x="1008" y="457" font-size="28" font-weight="700" class="pur">4</text>
  <rect x="826" y="316" width="248" height="44" class="lab"/>
  <text x="950" y="348" font-size="28" text-anchor="middle" class="ink">one table page</text>

  <text x="96" y="520" font-size="30" class="ink">Measure the pages a query reads.</text>
</svg>
