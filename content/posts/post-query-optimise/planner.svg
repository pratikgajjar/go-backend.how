<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 614" width="720" height="614" role="img" aria-label="Rows with a small seq sit together on disk and the planner picks an index scan; rows with a small score are on every page and it picks a bitmap scan, then a sequential scan">
<rect width="720" height="614" rx="6" fill="#fbfaf7" stroke="#0a0d12"/>
<g font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="11" fill="#0a0d12">
<path d="M0.5,6 a5.5,5.5 0 0 1 5.5,-5.5 h708 a5.5,5.5 0 0 1 5.5,5.5 V54 H0.5 Z" fill="#f1f0ed"/>
<text x="14" y="32" font-size="12.5"><tspan fill="#0a0d12">SELECT * FROM users WHERE </tspan><tspan fill="#0d53af">seq</tspan><tspan fill="#44484e"> (or </tspan><tspan fill="#0d53af">score</tspan><tspan fill="#44484e">)</tspan><tspan fill="#0a0d12"> &lt; </tspan><tspan fill="#6c4122">300,000</tspan><tspan fill="#0a0d12">;</tspan></text>
<text x="20" y="76" font-size="11.5" font-weight="800">WHERE seq &lt; 300,000 (disk order)</text>
<text x="20" y="94" fill="#44484e" font-size="10">planner's pick, x = 10 … 1M</text>
<rect x="20.0" y="100" width="280.0" height="18" fill="#ffdcb4" stroke="#c14900"/><text x="25.0" y="113" fill="#c14900" font-size="10" font-weight="700">Index Scan</text>
<rect x="300.0" y="100" width="40.0" height="18" fill="#ffdcb4" stroke="#c14900"/><text x="305.0" y="113" fill="#c14900" font-size="10" font-weight="700">Seq</text>
<rect x="18" y="132" width="324" height="422" fill="none" stroke="#0a0d12" stroke-dasharray="3 3"/>
<rect x="20" y="134" width="320" height="124" fill="#6c4122"/>
<rect x="20" y="258" width="158" height="2" fill="#6c4122"/>
<rect x="178" y="258" width="162" height="2" fill="#f6e3ce"/>
<rect x="20" y="260" width="320" height="290" fill="#f6e3ce"/>
<rect x="20" y="550" width="106" height="2" fill="#f6e3ce"/>
<text x="20" y="570" fill="#6c4122" font-size="10.5" font-weight="700">9,999 pages hold matches, all together</text>
<text x="380" y="76" font-size="11.5" font-weight="800">WHERE score &lt; 300,000 (random order)</text>
<text x="380" y="94" fill="#44484e" font-size="10">planner's pick, x = 10 … 1M</text>
<rect x="380.0" y="100" width="240.0" height="18" fill="#ffdcb4" stroke="#c14900"/><text x="385.0" y="113" fill="#c14900" font-size="10" font-weight="700">Bitmap Heap Scan</text>
<rect x="620.0" y="100" width="80.0" height="18" fill="#ffdcb4" stroke="#c14900"/><text x="625.0" y="113" fill="#c14900" font-size="10" font-weight="700">Seq Scan</text>
<rect x="378" y="132" width="324" height="422" fill="none" stroke="#0a0d12" stroke-dasharray="3 3"/>
<rect x="380" y="134" width="320" height="416" fill="#6c4122"/>
<rect x="380" y="550" width="106" height="2" fill="#6c4122"/>
<text x="380" y="570" fill="#6c4122" font-size="10.5" font-weight="700">33,333 pages hold matches: every page</text>
<rect x="20" y="586" width="11" height="11" fill="#6c4122" stroke="none"/><text x="37" y="596" fill="#44484e" font-size="10.5">page holds matching rows</text>
<rect x="240" y="586" width="11" height="11" fill="#f6e3ce" stroke="none"/><text x="257" y="596" fill="#44484e" font-size="10.5">page has none</text>
<rect x="460" y="586" width="11" height="11" fill="#ffdcb4" stroke="#c14900"/><text x="477" y="596" fill="#44484e" font-size="10.5">the planner's pick</text>
</g>
</svg>
