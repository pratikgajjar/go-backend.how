<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .brick { fill: var(--board); stroke: var(--ink); stroke-width: 2; }
    .win { fill: var(--purple-l); stroke: var(--purple); stroke-width: 2; }
    .look { fill: var(--purple); }
    .rule { stroke: var(--ink); stroke-width: 2.5; }
    text { font-family: var(--font-mono); }
  </style>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1104" height="526" class="ink"/>
  <rect x="48" y="48" width="1104" height="526" class="box"/>

  <text x="96" y="104" font-size="28" class="mute">backend.how</text>
  <text x="96" y="170" font-size="54" font-weight="800" class="ink">The Best Way to Learn</text>
  <text x="96" y="232" font-size="54" font-weight="800" class="ink">Backend Web Development</text>

  <!-- the months 4-6 window: feel comfortable in your stack -->
  <rect x="96" y="272" width="1008" height="112" class="win"/>
  <text x="116" y="318" font-size="28" font-weight="800" class="look">comfortable</text>
  <text x="116" y="358" font-size="28" class="ink">months 4–6</text>

  <!-- one brick = one month in one stack -->
  <!-- switch every 3 months: stops at month 3, below the window -->
  <rect x="640" y="456" width="140" height="32" class="brick"/>
  <rect x="640" y="420" width="140" height="32" class="brick"/>
  <rect x="640" y="384" width="140" height="32" class="brick"/>
  <!-- one stack: months 1-6 reach the window -->
  <rect x="900" y="456" width="140" height="32" class="brick"/>
  <rect x="900" y="420" width="140" height="32" class="brick"/>
  <rect x="900" y="384" width="140" height="32" class="brick"/>
  <rect x="900" y="348" width="140" height="32" class="brick"/>
  <rect x="900" y="312" width="140" height="32" class="brick"/>
  <rect x="900" y="276" width="140" height="32" class="brick"/>
  <line x1="600" y1="490" x2="1080" y2="490" class="rule"/>
  <g font-size="28" text-anchor="middle">
    <text x="710" y="526" class="ink">switch</text>
    <text x="970" y="526" class="ink">one stack</text>
  </g>

  <text x="96" y="466" font-size="28" class="ink">One stack for 6 months.</text>
</svg>
