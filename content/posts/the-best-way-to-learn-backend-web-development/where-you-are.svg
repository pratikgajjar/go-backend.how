<text x="2" y="154" font-size="11.5" fill="#17210c">Without the switch it would sit at months 4–6. The 5 months in earlier stacks pushed it to 9–11.</text>
<text x="2" y="172" font-size="11.5" fill="#17210c">With JavaScript on, you can enter your own months, your week, and what you have built.</text>
