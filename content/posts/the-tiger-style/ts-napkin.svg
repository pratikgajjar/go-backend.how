<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Per-transfer cost of network, disk, memory, and CPU as the batch grows from 1 to 8,189, with sample costs" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
