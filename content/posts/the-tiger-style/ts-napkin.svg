<text x="20.0" y="28.0" font-size="13" fill="#15181d" text-anchor="start" font-weight="400" xml:space="preserve">A batch of 1 transfer pays one 500 µs round trip and one 1 ms fsync.</text>
<text x="20.0" y="48.0" font-size="13" fill="#15181d" text-anchor="start" font-weight="400" xml:space="preserve">Each transfer pays 4 cache misses of 100 ns, 100 ns of CPU, and its 128 bytes of bandwidth.</text>
