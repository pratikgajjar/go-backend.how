<text x="20.0" y="28.0" font-size="13" fill="#15181d" text-anchor="start" font-weight="400">At 8,189 transfers per batch, the 500 µs round trip and the 1 ms fsync are shared;</text>
<text x="20.0" y="48.0" font-size="13" fill="#15181d" text-anchor="start" font-weight="400">the 4 cache misses of 100 ns are paid by each transfer. <tspan fill="#6f2fb0" font-weight="700">Memory</tspan> costs the most.</text>
