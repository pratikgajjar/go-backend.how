<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700" role="img" aria-label="A small Zig queue after nine Tiger Style rules; each line is tagged with the rules that changed it: five for safety, one for performance, three for developer experience" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<rect width="980" height="700" fill="#19120d"/>
<text x="20.0" y="30.0" font-size="12" fill="#a79d92" text-anchor="start" font-weight="400" xml:space="preserve">Ordinary queue code after nine rules. Numbers in the margin: the rules that changed the line.</text>
<rect x="16" y="52" width="668" height="622" fill="none" stroke="#3d342c"/>
<rect x="17" y="57" width="666" height="19" fill="#3a2350"/>
<text x="64.0" y="70.0" font-size="10" fill="#c8a0f0" text-anchor="end" font-weight="700" xml:space="preserve">9</text>
<text x="72" y="70" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan></tspan><tspan fill="#a79d92" font-style="italic">/// A queue of transfers with a fixed capacity, allocated once at startup.</tspan></text>
<rect x="17" y="76" width="666" height="19" fill="#3a2350"/>
<text x="64.0" y="89.0" font-size="10" fill="#c8a0f0" text-anchor="end" font-weight="700" xml:space="preserve">3,8</text>
<text x="72" y="89" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>pub fn TransferQueue(comptime capacity_max: u32) type {</tspan></text>
<rect x="17" y="95" width="666" height="19" fill="#3a2350"/>
<text x="64.0" y="108.0" font-size="10" fill="#c8a0f0" text-anchor="end" font-weight="700" xml:space="preserve">2</text>
<text x="72" y="108" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>    comptime {</tspan></text>
<rect x="17" y="114" width="666" height="19" fill="#3a2350"/>
<text x="64.0" y="127.0" font-size="10" fill="#c8a0f0" text-anchor="end" font-weight="700" xml:space="preserve">2,8</text>
<text x="72" y="127" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>        </tspan><tspan fill="#7fdc9c" font-weight="700">assert</tspan><tspan>(capacity_max &gt; 0);</tspan></text>
<rect x="17" y="133" width="666" height="19" fill="#3a2350"/>
<text x="64.0" y="146.0" font-size="10" fill="#c8a0f0" text-anchor="end" font-weight="700" xml:space="preserve">2,8,9</text>
<text x="72" y="146" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>        </tspan><tspan fill="#7fdc9c" font-weight="700">assert</tspan><tspan>(capacity_max &lt;= 8189); </tspan><tspan fill="#a79d92" font-style="italic">// One create_transfers batch.</tspan></text>
<rect x="17" y="152" width="666" height="19" fill="#3a2350"/>
<text x="64.0" y="165.0" font-size="10" fill="#c8a0f0" text-anchor="end" font-weight="700" xml:space="preserve">2</text>
<text x="72" y="165" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>    }</tspan></text>
<text x="72" y="184" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>    return struct {</tspan></text>
<text x="72" y="203" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>        const Queue = @This();</tspan></text>
<text x="72" y="222" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan></tspan></text>
<rect x="17" y="228" width="666" height="19" fill="#3a2350"/>
<text x="64.0" y="241.0" font-size="10" fill="#c8a0f0" text-anchor="end" font-weight="700" xml:space="preserve">1,8</text>
<text x="72" y="241" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>        buffer: [capacity_max]Transfer = undefined,</tspan></text>
<rect x="17" y="247" width="666" height="19" fill="#3a2350"/>
<text x="64.0" y="260.0" font-size="10" fill="#c8a0f0" text-anchor="end" font-weight="700" xml:space="preserve">3,8</text>
<text x="72" y="260" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>        head_index: u32 = 0,</tspan></text>
<rect x="17" y="266" width="666" height="19" fill="#3a2350"/>
<text x="64.0" y="279.0" font-size="10" fill="#c8a0f0" text-anchor="end" font-weight="700" xml:space="preserve">3,8</text>
<text x="72" y="279" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>        count: u32 = 0,</tspan></text>
<text x="72" y="298" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan></tspan></text>
<rect x="17" y="304" width="666" height="19" fill="#3a2350"/>
<text x="64.0" y="317.0" font-size="10" fill="#c8a0f0" text-anchor="end" font-weight="700" xml:space="preserve">9</text>
<text x="72" y="317" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>        </tspan><tspan fill="#a79d92" font-style="italic">/// The caller checks for space first, so a full queue here is a bug.</tspan></text>
<rect x="17" y="323" width="666" height="19" fill="#3a2350"/>
<text x="64.0" y="336.0" font-size="10" fill="#c8a0f0" text-anchor="end" font-weight="700" xml:space="preserve">4,7</text>
<text x="72" y="336" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>        pub fn push(queue: *Queue, transfer: *const Transfer) void {</tspan></text>
<rect x="17" y="342" width="666" height="19" fill="#3a2350"/>
<text x="64.0" y="355.0" font-size="10" fill="#c8a0f0" text-anchor="end" font-weight="700" xml:space="preserve">4,8</text>
<text x="72" y="355" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>            </tspan><tspan fill="#7fdc9c" font-weight="700">assert</tspan><tspan>(queue.count &lt; capacity_max);</tspan></text>
<rect x="17" y="361" width="666" height="19" fill="#3a2350"/>
<text x="64.0" y="374.0" font-size="10" fill="#c8a0f0" text-anchor="end" font-weight="700" xml:space="preserve">5</text>
<text x="72" y="374" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>            </tspan><tspan fill="#7fdc9c" font-weight="700">assert</tspan><tspan>(transfer.id != 0);</tspan></text>
<rect x="17" y="380" width="666" height="19" fill="#3a2350"/>
<text x="64.0" y="393.0" font-size="10" fill="#c8a0f0" text-anchor="end" font-weight="700" xml:space="preserve">5,9</text>
<text x="72" y="393" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>            </tspan><tspan fill="#7fdc9c" font-weight="700">assert</tspan><tspan>(transfer.timestamp == 0); </tspan><tspan fill="#a79d92" font-style="italic">// Set by the cluster, not the client.</tspan></text>
<rect x="17" y="399" width="666" height="19" fill="#3a2350"/>
<text x="64.0" y="412.0" font-size="10" fill="#c8a0f0" text-anchor="end" font-weight="700" xml:space="preserve">5</text>
<text x="72" y="412" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan></tspan></text>
<rect x="17" y="418" width="666" height="19" fill="#3a2350"/>
<text x="64.0" y="431.0" font-size="10" fill="#c8a0f0" text-anchor="end" font-weight="700" xml:space="preserve">8</text>
<text x="72" y="431" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>            const index = (queue.head_index + queue.count) % capacity_max;</tspan></text>
<rect x="17" y="437" width="666" height="19" fill="#3a2350"/>
<text x="64.0" y="450.0" font-size="10" fill="#c8a0f0" text-anchor="end" font-weight="700" xml:space="preserve">7,8</text>
<text x="72" y="450" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>            queue.buffer[index] = transfer.*;</tspan></text>
<rect x="17" y="456" width="666" height="19" fill="#3a2350"/>
<text x="64.0" y="469.0" font-size="10" fill="#c8a0f0" text-anchor="end" font-weight="700" xml:space="preserve">8</text>
<text x="72" y="469" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>            queue.count += 1;</tspan></text>
<rect x="17" y="475" width="666" height="19" fill="#3a2350"/>
<text x="64.0" y="488.0" font-size="10" fill="#c8a0f0" text-anchor="end" font-weight="700" xml:space="preserve">5,8</text>
<text x="72" y="488" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>            </tspan><tspan fill="#7fdc9c" font-weight="700">assert</tspan><tspan>(queue.count &lt;= capacity_max);</tspan></text>
<text x="72" y="507" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>        }</tspan></text>
<text x="72" y="526" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan></tspan></text>
<rect x="17" y="532" width="666" height="19" fill="#3a2350"/>
<text x="64.0" y="545.0" font-size="10" fill="#c8a0f0" text-anchor="end" font-weight="700" xml:space="preserve">9</text>
<text x="72" y="545" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>        </tspan><tspan fill="#a79d92" font-style="italic">/// One check for the whole batch, then one push per transfer.</tspan></text>
<text x="72" y="564" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>        pub fn push_batch(queue: *Queue, transfers: []const Transfer) void {</tspan></text>
<rect x="17" y="570" width="666" height="19" fill="#3a2350"/>
<text x="64.0" y="583.0" font-size="10" fill="#c8a0f0" text-anchor="end" font-weight="700" xml:space="preserve">6,8</text>
<text x="72" y="583" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>            </tspan><tspan fill="#7fdc9c" font-weight="700">assert</tspan><tspan>(transfers.len &lt;= capacity_max - queue.count);</tspan></text>
<rect x="17" y="589" width="666" height="19" fill="#3a2350"/>
<text x="64.0" y="602.0" font-size="10" fill="#c8a0f0" text-anchor="end" font-weight="700" xml:space="preserve">4,7</text>
<text x="72" y="602" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>            for (transfers) |*transfer| queue.push(transfer);</tspan></text>
<text x="72" y="621" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>        }</tspan></text>
<text x="72" y="640" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>    };</tspan></text>
<text x="72" y="659" font-size="11.5" fill="#efe6dc" xml:space="preserve"><tspan>}</tspan></text>
<text x="700.0" y="52.0" font-size="10.5" fill="#a79d92" text-anchor="start" font-weight="400" xml:space="preserve">the nine rules, in goal order</text>
<line x1="700" x2="700" y1="60" y2="92" stroke="#7fdc9c" stroke-width="2"/>
<text x="710.0" y="70.0" font-size="9.5" fill="#a79d92" text-anchor="start" font-weight="400" xml:space="preserve">1 · SAFETY</text>
<text x="710.0" y="85.0" font-size="11.5" fill="#efe6dc" text-anchor="start" font-weight="400" xml:space="preserve">Allocate all memory at startup.</text>
<line x1="700" x2="700" y1="104" y2="136" stroke="#7fdc9c" stroke-width="2"/>
<text x="710.0" y="114.0" font-size="9.5" fill="#a79d92" text-anchor="start" font-weight="400" xml:space="preserve">2 · SAFETY</text>
<text x="710.0" y="129.0" font-size="11.5" fill="#efe6dc" text-anchor="start" font-weight="400" xml:space="preserve">Put a limit on everything.</text>
<line x1="700" x2="700" y1="148" y2="180" stroke="#7fdc9c" stroke-width="2"/>
<text x="710.0" y="158.0" font-size="9.5" fill="#a79d92" text-anchor="start" font-weight="400" xml:space="preserve">3 · SAFETY</text>
<text x="710.0" y="173.0" font-size="11.5" fill="#efe6dc" text-anchor="start" font-weight="400" xml:space="preserve">Use explicitly sized types.</text>
<line x1="700" x2="700" y1="192" y2="224" stroke="#7fdc9c" stroke-width="2"/>
<text x="710.0" y="202.0" font-size="9.5" fill="#a79d92" text-anchor="start" font-weight="400" xml:space="preserve">4 · SAFETY</text>
<text x="710.0" y="217.0" font-size="11.5" fill="#efe6dc" text-anchor="start" font-weight="400" xml:space="preserve">A full queue is a bug, so assert it.</text>
<line x1="700" x2="700" y1="236" y2="268" stroke="#7fdc9c" stroke-width="2"/>
<text x="710.0" y="246.0" font-size="9.5" fill="#a79d92" text-anchor="start" font-weight="400" xml:space="preserve">5 · SAFETY</text>
<text x="710.0" y="261.0" font-size="11.5" fill="#efe6dc" text-anchor="start" font-weight="400" xml:space="preserve">Assert arguments and postconditions.</text>
<line x1="700" x2="700" y1="280" y2="312" stroke="#3d342c" stroke-width="2"/>
<text x="710.0" y="290.0" font-size="9.5" fill="#a79d92" text-anchor="start" font-weight="400" xml:space="preserve">6 · PERFORMANCE</text>
<text x="710.0" y="305.0" font-size="11.5" fill="#efe6dc" text-anchor="start" font-weight="400" xml:space="preserve">Batch: check once per batch.</text>
<line x1="700" x2="700" y1="324" y2="356" stroke="#3d342c" stroke-width="2"/>
<text x="710.0" y="334.0" font-size="9.5" fill="#a79d92" text-anchor="start" font-weight="400" xml:space="preserve">7 · DEVELOPER EXPERIENCE</text>
<text x="710.0" y="349.0" font-size="11.5" fill="#efe6dc" text-anchor="start" font-weight="400" xml:space="preserve">Pass large arguments by *const.</text>
<line x1="700" x2="700" y1="368" y2="400" stroke="#3d342c" stroke-width="2"/>
<text x="710.0" y="378.0" font-size="9.5" fill="#a79d92" text-anchor="start" font-weight="400" xml:space="preserve">8 · DEVELOPER EXPERIENCE</text>
<text x="710.0" y="393.0" font-size="11.5" fill="#efe6dc" text-anchor="start" font-weight="400" xml:space="preserve">Get the nouns right.</text>
<line x1="700" x2="700" y1="412" y2="444" stroke="#3d342c" stroke-width="2"/>
<text x="710.0" y="422.0" font-size="9.5" fill="#a79d92" text-anchor="start" font-weight="400" xml:space="preserve">9 · DEVELOPER EXPERIENCE</text>
<text x="710.0" y="437.0" font-size="11.5" fill="#efe6dc" text-anchor="start" font-weight="400" xml:space="preserve">Always say why.</text>
</svg>
