<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .safe { fill: var(--green-l); stroke: var(--green); stroke-width: 3; }
    .rank { fill: var(--purple); }
    text { font-family: var(--font-mono); }
  </style>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1104" height="526" class="ink"/>
  <rect x="48" y="48" width="1104" height="526" class="box"/>

  <text x="96" y="116" font-size="28" class="mute">backend.how</text>
  <text x="96" y="190" font-size="58" font-weight="800" class="ink">The Tiger Style</text>
  <text x="96" y="244" font-size="32" font-weight="600" class="ink">TigerBeetle's coding guide ranks three goals</text>

  <!-- three goals as steps: the higher the step, the higher the rank -->
  <rect x="96"  y="300" width="300" height="226" class="safe"/>
  <rect x="450" y="356" width="300" height="170" class="box"/>
  <rect x="804" y="412" width="300" height="114" class="box"/>

  <g font-size="32" font-weight="800" class="ink">
    <text x="118" y="350">1 safety</text>
    <text x="472" y="406">2 performance</text>
    <text x="826" y="462">3 developer</text>
    <text x="864" y="502">experience</text>
  </g>

  <!-- order markers between steps -->
  <g font-size="60" font-weight="800" text-anchor="middle" class="rank">
    <text x="423" y="486">&gt;</text>
    <text x="777" y="486">&gt;</text>
  </g>
</svg>
