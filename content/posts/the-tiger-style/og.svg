<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .safe { fill: var(--green-l); stroke: var(--green); stroke-width: 3; }
    .rank { fill: var(--purple); }
    text { font-family: var(--font-mono); }
  </style>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1096" height="526" class="ink"/>
  <rect x="48" y="48" width="1096" height="526" class="box"/>

  <text x="96" y="112" font-size="24" class="mute">backend.how</text>
  <text x="96" y="186" font-size="58" font-weight="800" class="ink">The Tiger Style</text>
  <text x="96" y="238" font-size="32" font-weight="600" class="ink">TigerBeetle's coding guide ranks three goals</text>

  <!-- three goals as steps: the higher the step, the higher the rank -->
  <rect x="96"  y="290" width="290" height="236" class="safe"/>
  <rect x="451" y="340" width="290" height="186" class="box"/>
  <rect x="806" y="390" width="290" height="136" class="box"/>

  <g font-size="30" font-weight="800" class="ink">
    <text x="116" y="336">1 safety</text>
    <text x="471" y="386">2 performance</text>
    <text x="826" y="432">3 developer</text>
    <text x="862" y="466">experience</text>
  </g>
  <g font-size="22" class="ink">
    <text x="152" y="388">assert inputs</text>
    <text x="152" y="422">limit every loop</text>
    <text x="152" y="456">static memory</text>
    <text x="507" y="438">sketch costs</text>
    <text x="507" y="472">batch the work</text>
    <text x="862" y="506">name things well</text>
  </g>

  <!-- order markers between steps -->
  <g font-size="60" font-weight="800" text-anchor="middle" class="rank">
    <text x="418" y="478">&gt;</text>
    <text x="773" y="478">&gt;</text>
  </g>
</svg>
