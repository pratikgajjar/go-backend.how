<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="The 128-byte TigerBeetle Transfer, 16 bytes per row, with no padding, and the three compile-time assertions that hold" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
