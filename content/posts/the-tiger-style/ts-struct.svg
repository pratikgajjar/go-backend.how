<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="TigerBeetle's 128-byte Transfer with amount changed to u64: 8 bytes of padding follow amount, the size stays 128, and only the no_padding assertion fails" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<rect width="900" height="330" fill="#fbfbf8"/>
<text x="20" y="28" font-size="11" fill="#15181d" font-weight="700">Transfer with amount: u64 · bytes, 16 per row</text>
<text x="48" y="65" font-size="10" fill="#565b64" text-anchor="end">0</text>
<text x="48" y="99" font-size="10" fill="#565b64" text-anchor="end">16</text>
<text x="48" y="133" font-size="10" fill="#565b64" text-anchor="end">32</text>
<text x="48" y="167" font-size="10" fill="#565b64" text-anchor="end">48</text>
<text x="48" y="201" font-size="10" fill="#565b64" text-anchor="end">64</text>
<text x="48" y="235" font-size="10" fill="#565b64" text-anchor="end">80</text>
<text x="48" y="269" font-size="10" fill="#565b64" text-anchor="end">96</text>
<text x="48" y="303" font-size="10" fill="#565b64" text-anchor="end">112</text>
<rect x="57.0" y="45" width="482.0" height="32" fill="#f3e6d6" stroke="#7a5530"/><text x="62.0" y="65" font-size="10" font-weight="700" fill="#7a5530">id</text>
<rect x="57.0" y="79" width="482.0" height="32" fill="#f3e6d6" stroke="#7a5530"/><text x="62.0" y="99" font-size="10" font-weight="700" fill="#7a5530">debit_account_id</text>
<rect x="57.0" y="113" width="482.0" height="32" fill="#f3e6d6" stroke="#7a5530"/><text x="62.0" y="133" font-size="10" font-weight="700" fill="#7a5530">credit_account_id</text>
<rect x="57.0" y="147" width="240.0" height="32" fill="#f3e6d6" stroke="#7a5530"/><text x="62.0" y="167" font-size="10" font-weight="700" fill="#7a5530">amount: u64</text>
<rect x="299.0" y="147" width="240.0" height="32" fill="#f8e0dc" stroke="#b83026" stroke-width="1.5" stroke-dasharray="4 3"/><text x="419.0" y="167" font-size="10" font-weight="800" fill="#b83026" text-anchor="middle">pad · 8 B</text>
<rect x="57.0" y="181" width="482.0" height="32" fill="#f3e6d6" stroke="#7a5530"/><text x="62.0" y="201" font-size="10" font-weight="700" fill="#7a5530">pending_id</text>
<rect x="57.0" y="215" width="482.0" height="32" fill="#f3e6d6" stroke="#7a5530"/><text x="62.0" y="235" font-size="10" font-weight="700" fill="#7a5530">user_data_128</text>
<rect x="57.0" y="249" width="240.0" height="32" fill="#f3e6d6" stroke="#7a5530"/><text x="62.0" y="269" font-size="10" font-weight="700" fill="#7a5530">user_data_64</text>
<rect x="299.0" y="249" width="119.0" height="32" fill="#f3e6d6" stroke="#7a5530"/><text x="304.0" y="269" font-size="10" font-weight="700" fill="#7a5530">user_data_32</text>
<rect x="420.0" y="249" width="119.0" height="32" fill="#f3e6d6" stroke="#7a5530"/><text x="425.0" y="269" font-size="10" font-weight="700" fill="#7a5530">timeout</text>
<rect x="57.0" y="283" width="119.0" height="32" fill="#f3e6d6" stroke="#7a5530"/><text x="62.0" y="303" font-size="10" font-weight="700" fill="#7a5530">ledger</text>
<rect x="178.0" y="283" width="58.5" height="32" fill="#f3e6d6" stroke="#7a5530"/><text x="183.0" y="303" font-size="10" font-weight="700" fill="#7a5530">code</text>
<rect x="238.5" y="283" width="58.5" height="32" fill="#f3e6d6" stroke="#7a5530"/><text x="243.5" y="303" font-size="10" font-weight="700" fill="#7a5530">flags</text>
<rect x="299.0" y="283" width="240.0" height="32" fill="#f3e6d6" stroke="#7a5530"/><text x="304.0" y="303" font-size="10" font-weight="700" fill="#7a5530">timestamp</text>
<text x="572" y="28" font-size="11" fill="#15181d" font-weight="700">comptime</text>
<text x="572" y="60" font-size="11" fill="#15181d">assert(stdx.no_padding(Transfer));</text><text x="584" y="76" font-size="11" fill="#b83026" font-weight="800">// fails: 8 B of padding</text>
<text x="572" y="100" font-size="11" fill="#15181d">assert(@sizeOf(Transfer) == 128);</text><text x="584" y="116" font-size="11" fill="#565b64" font-weight="400">// size is 128</text>
<text x="572" y="140" font-size="11" fill="#15181d">assert(@alignOf(Transfer) == 16);</text><text x="584" y="156" font-size="11" fill="#565b64" font-weight="400">// align is 16</text>
<text x="572" y="196" font-size="11" fill="#15181d">pending_id must start at a multiple</text>
<text x="572" y="214" font-size="11" fill="#15181d">of 16, so 8 bytes of padding follow</text>
<text x="572" y="232" font-size="11" fill="#15181d">amount. The size is still 128, so</text>
<text x="572" y="250" font-size="11" fill="#15181d">only no_padding fails.</text>
</svg>
