<rect x="61" y="155" width="510" height="34" fill="#3e2f1f" stroke="#e2bf8a"/>
<text x="66.0" y="169.0" font-size="11" fill="#e2bf8a" text-anchor="start" font-weight="700" xml:space="preserve">amount</text>
