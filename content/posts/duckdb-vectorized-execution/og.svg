<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .row { fill: var(--board); stroke: var(--ink); stroke-width: 2; stroke-dasharray: 6 4; }
    .vec { fill: var(--board); stroke: var(--ink); stroke-width: 2; stroke-dasharray: 7 5; }
    .slice { stroke: var(--line); stroke-width: 1.5; }
    .redl { stroke: var(--red); stroke-width: 3; } .red { fill: var(--red); }
    .grnl { stroke: var(--green); stroke-width: 4; } .grn { fill: var(--green); }
    text { font-family: var(--font-mono); }
  </style>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1096" height="526" class="ink"/>
  <rect x="48" y="48" width="1096" height="526" class="box"/>

  <text x="96" y="112" font-size="24" class="mute">backend.how</text>
  <text x="96" y="182" font-size="58" font-weight="800" class="ink">DuckDB Beats Postgres 80×</text>
  <text x="96" y="236" font-size="32" font-weight="600" class="ink">on Analytics — The Vectorized Execution Tour</text>

  <!-- Postgres: one call per row -->
  <text x="96" y="351" font-size="26" font-weight="700" class="ink">Postgres</text>
  <g>
    <rect x="290" y="322" width="40" height="40" class="row"/>
    <rect x="338" y="322" width="40" height="40" class="row"/>
    <rect x="386" y="322" width="40" height="40" class="row"/>
    <rect x="434" y="322" width="40" height="40" class="row"/>
    <rect x="482" y="322" width="40" height="40" class="row"/>
    <rect x="530" y="322" width="40" height="40" class="row"/>
    <rect x="578" y="322" width="40" height="40" class="row"/>
    <rect x="626" y="322" width="40" height="40" class="row"/>
    <rect x="674" y="322" width="40" height="40" class="row"/>
    <rect x="722" y="322" width="40" height="40" class="row"/>
  </g>
  <g>
    <line x1="310" y1="284" x2="310" y2="306" class="redl"/><path d="M310 318 l-7 -12 h14 z" class="red"/>
    <line x1="358" y1="284" x2="358" y2="306" class="redl"/><path d="M358 318 l-7 -12 h14 z" class="red"/>
    <line x1="406" y1="284" x2="406" y2="306" class="redl"/><path d="M406 318 l-7 -12 h14 z" class="red"/>
    <line x1="454" y1="284" x2="454" y2="306" class="redl"/><path d="M454 318 l-7 -12 h14 z" class="red"/>
    <line x1="502" y1="284" x2="502" y2="306" class="redl"/><path d="M502 318 l-7 -12 h14 z" class="red"/>
    <line x1="550" y1="284" x2="550" y2="306" class="redl"/><path d="M550 318 l-7 -12 h14 z" class="red"/>
    <line x1="598" y1="284" x2="598" y2="306" class="redl"/><path d="M598 318 l-7 -12 h14 z" class="red"/>
    <line x1="646" y1="284" x2="646" y2="306" class="redl"/><path d="M646 318 l-7 -12 h14 z" class="red"/>
    <line x1="694" y1="284" x2="694" y2="306" class="redl"/><path d="M694 318 l-7 -12 h14 z" class="red"/>
    <line x1="742" y1="284" x2="742" y2="306" class="redl"/><path d="M742 318 l-7 -12 h14 z" class="red"/>
  </g>
  <text x="792" y="351" font-size="24" class="ink">1 call per row</text>

  <!-- DuckDB: one call per 2048-row vector -->
  <text x="96" y="451" font-size="26" font-weight="700" class="ink">DuckDB</text>
  <line x1="526" y1="384" x2="526" y2="402" class="grnl"/><path d="M526 418 l-10 -16 h20 z" class="grn"/>
  <rect x="290" y="422" width="472" height="40" class="vec"/>
  <text x="526" y="450" font-size="22" text-anchor="middle" class="ink">vector of 2048 rows</text>
  <text x="792" y="451" font-size="24" class="ink">1 call per vector</text>

  <text x="96" y="512" font-size="26" class="ink">Q01, SF=10: Postgres 11,678 ms, DuckDB 210.5 ms</text>
</svg>
