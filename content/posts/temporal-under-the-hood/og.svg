<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .proc { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .base { fill: var(--tint2); stroke: var(--ink); stroke-width: 2; stroke-dasharray: 7 5; }
    .step { fill: var(--brown-l); stroke: var(--brown); stroke-width: 2; stroke-dasharray: 7 5; }
    text { font-family: var(--font-mono); }
  </style>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1104" height="526" class="ink"/>
  <rect x="48" y="48" width="1104" height="526" class="box"/>

  <text x="96" y="120" font-size="28" class="mute">backend.how</text>
  <text x="96" y="198" font-size="58" font-weight="800" class="ink">Temporal — Under the Hood</text>
  <text x="96" y="256" font-size="34" font-weight="600" class="ink">SQL statements for one 3-step workflow</text>

  <!-- 4.4 px per SQL statement: grey fixed cost (~40 / ~11), then one brown block per step (35 / 7) -->
  <g font-size="28" font-weight="700" text-anchor="middle" class="ink">
    <rect x="96" y="298" width="170" height="72" class="proc"/><text x="181" y="344">Temporal</text>
    <rect x="96" y="390" width="170" height="72" class="proc"/><text x="181" y="436">Absurd</text>
  </g>
  <rect x="290" y="298" width="176" height="72" class="base"/>
  <rect x="466" y="298" width="154" height="72" class="step"/>
  <rect x="620" y="298" width="154" height="72" class="step"/>
  <rect x="774" y="298" width="154" height="72" class="step"/>

  <rect x="290" y="390" width="48.4" height="72" class="base"/>
  <rect x="338.4" y="390" width="30.8" height="72" class="step"/>
  <rect x="369.2" y="390" width="30.8" height="72" class="step"/>
  <rect x="400" y="390" width="30.8" height="72" class="step"/>

  <g font-size="34" font-weight="800" class="ink">
    <text x="950" y="346">145 SQL</text>
    <text x="452" y="438">32 SQL</text>
  </g>

  <text x="96" y="518" font-size="30" class="ink">Same job, about a fifth of the SQL.</text>
</svg>
