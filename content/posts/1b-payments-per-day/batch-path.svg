<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img" aria-label="One create_transfers batch through a TigerBeetle replica: the WAL prepare and header writes, the state machine and its 33 LSM trees, compaction into the grid, and the superblock checkpoint.">
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#14171c"/></marker>
  </defs>
  <rect width="900" height="330" fill="#fbf7ec"/>

  <!-- processes: solid -->
  <rect x="10" y="36" width="140" height="64" fill="#fbf7ec" stroke="#14171c" stroke-width="1.4"/>
  <text x="80" y="64" font-size="13" font-weight="800" text-anchor="middle" fill="#14171c">Go client</text>
  <text x="80" y="80" font-size="10" text-anchor="middle" fill="#555a63">8,190 per request</text>

  <rect x="230" y="16" width="440" height="104" fill="#fbf7ec" stroke="#14171c" stroke-width="1.4"/>
  <text x="240" y="34" font-size="11.5" font-weight="800" fill="#14171c">tigerbeetle <tspan font-weight="400" fill="#555a63">· primary · one thread</tspan></text>
  <rect x="246" y="50" width="190" height="58" fill="#fbf7ec" stroke="#14171c" stroke-width="1.4"/>
  <text x="341" y="76" font-size="11.5" font-weight="800" text-anchor="middle" fill="#14171c">state machine</text>
  <text x="341" y="91" font-size="10" text-anchor="middle" fill="#555a63">balances · limits · ids</text>
  <rect x="456" y="50" width="198" height="58" fill="#fbf7ec" stroke="#14171c" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="555" y="76" font-size="11.5" font-weight="800" text-anchor="middle" fill="#14171c">33 LSM trees</text>
  <text x="555" y="91" font-size="10" text-anchor="middle" fill="#555a63">in-memory tables</text>
  <line x1="436" y1="79" x2="456" y2="79" stroke="#14171c" stroke-width="1.7"/>

  <!-- client <-> primary -->
  <path d="M150,58 L228,58" stroke="#14171c" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
  <path d="M230,86 L152,86" stroke="#14171c" stroke-width="1.7" fill="none" marker-end="url(#a)"/>
  <text x="190" y="52" font-size="10" text-anchor="middle" fill="#7a5530" font-weight="700">1 MiB</text>
  <text x="190" y="100" font-size="10" text-anchor="middle" fill="#555a63">reply</text>

  <!-- data file zones: data at rest, dashed; green = durable -->
  <text x="10" y="180" font-size="10" font-weight="800" fill="#14171c" letter-spacing="0.08em">0_0.TIGERBEETLE <tspan font-weight="400" letter-spacing="0" fill="#555a63">· one file · 21 GB after the benchmark · not to scale</tspan></text>
  <g stroke-width="1.3" stroke-dasharray="5 4">
    <rect x="10" y="190" width="114" height="70" fill="#d4efdd" stroke="#1e7a47"/>
    <rect x="124" y="190" width="123" height="70" fill="#d4efdd" stroke="#1e7a47"/>
    <rect x="247" y="190" width="211" height="70" fill="#d4efdd" stroke="#1e7a47"/>
    <rect x="458" y="190" width="141" height="70" fill="#fbf7ec" stroke="#14171c"/>
    <rect x="599" y="190" width="291" height="70" fill="#d4efdd" stroke="#1e7a47"/>
  </g>
  <g font-size="11.5" font-weight="800" text-anchor="middle" fill="#14171c">
    <text x="67" y="223">superblock</text><text x="185" y="223">WAL headers</text><text x="352" y="223">WAL prepares</text>
    <text x="528" y="223">client replies</text><text x="744" y="223">grid</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#7a5530">
    <text x="67" y="238">4 × 24 KiB</text><text x="185" y="238">1,024 × 256 B</text><text x="352" y="238">1,024 × 1 MiB</text>
    <text x="528" y="238">64 × 1 MiB</text><text x="744" y="238">512 KiB blocks · ≈ 20 GB</text>
  </g>

  <!-- numbered writes -->
  <g stroke="#14171c" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M320,108 L320,150 L352,150 L352,188"/>
    <path d="M300,108 L300,160 L185,160 L185,188"/>
    <path d="M620,108 L620,150 L744,150 L744,188"/>
    <path d="M629,260 C609,292 67,292 67,262"/>
  </g>
  <g font-size="10" font-weight="800" text-anchor="middle">
    <circle cx="352" cy="150" r="8" fill="#14171c"/><text x="352" y="153.5" fill="#fbf7ec">1</text>
    <circle cx="185" cy="160" r="8" fill="#14171c"/><text x="185" y="163.5" fill="#fbf7ec">2</text>
    <circle cx="744" cy="150" r="8" fill="#14171c"/><text x="744" y="153.5" fill="#fbf7ec">3</text>
    <circle cx="350" cy="287" r="8" fill="#14171c"/><text x="350" y="290.5" fill="#fbf7ec">4</text>
  </g>
  <g font-size="10.5" fill="#14171c">
    <text x="10" y="312">1 prepare (1 MiB) and 2 its header sector: durable, then execute and reply.</text>
    <text x="10" y="326">3 every 32 ops, tables compact into the grid. 4 every 960 ops, a new superblock.</text>
  </g>
</svg>
