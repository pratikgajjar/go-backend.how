<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .pay { fill: var(--board); stroke: var(--ink); stroke-width: 2; stroke-dasharray: 7 5; }
    .flush { fill: var(--red); } .redt { fill: var(--red); }
    .dur { fill: var(--green); } .grnt { fill: var(--green); }
    text { font-family: var(--font-mono); }
  </style>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1104" height="526" class="ink"/>
  <rect x="48" y="48" width="1104" height="526" class="box"/>

  <text x="96" y="110" font-size="28" class="mute">backend.how</text>
  <text x="96" y="180" font-size="58" font-weight="800" class="ink">1B Payments/Day</text>
  <text x="96" y="234" font-size="34" font-weight="600" class="ink">TigerBeetle &amp; PostgreSQL</text>

  <!-- PostgreSQL: each commit waits for its own WAL flush -->
  <text x="96" y="322" font-size="30" font-weight="700" class="ink">PostgreSQL</text>
  <g font-size="28" text-anchor="middle">
    <rect x="320" y="282" width="100" height="60" class="pay"/><text x="370" y="322" class="ink">1 tx</text><rect x="428" y="276" width="10" height="72" class="flush"/>
    <rect x="446" y="282" width="100" height="60" class="pay"/><text x="496" y="322" class="ink">1 tx</text><rect x="554" y="276" width="10" height="72" class="flush"/>
    <rect x="572" y="282" width="100" height="60" class="pay"/><text x="622" y="322" class="ink">1 tx</text><rect x="680" y="276" width="10" height="72" class="flush"/>
    <rect x="698" y="282" width="100" height="60" class="pay"/><text x="748" y="322" class="ink">1 tx</text><rect x="806" y="276" width="10" height="72" class="flush"/>
  </g>
  <text x="1104" y="326" font-size="38" font-weight="800" text-anchor="end" class="ink">3,356/s</text>

  <!-- TigerBeetle: one durable write for the whole batch -->
  <text x="96" y="414" font-size="30" font-weight="700" class="ink">TigerBeetle</text>
  <rect x="320" y="374" width="478" height="60" class="pay"/>
  <text x="559" y="414" font-size="28" text-anchor="middle" class="ink">8,190 transfers</text>
  <rect x="806" y="368" width="10" height="72" class="dur"/>
  <text x="1104" y="418" font-size="38" font-weight="800" text-anchor="end" class="ink">~48K/s</text>

  <!-- legend -->
  <rect x="96" y="482" width="10" height="36" class="flush"/>
  <text x="120" y="510" font-size="28" class="redt">WAL flush per commit</text>
  <rect x="520" y="482" width="10" height="36" class="dur"/>
  <text x="544" y="510" font-size="28" class="grnt">one durable write per batch</text>
</svg>
