<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .pay { fill: var(--board); stroke: var(--ink); stroke-width: 2; stroke-dasharray: 7 5; }
    .flush { fill: var(--red); } .redt { fill: var(--red); }
    .dur { fill: var(--green); } .grnt { fill: var(--green); }
    text { font-family: var(--font-mono); }
  </style>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1096" height="526" class="ink"/>
  <rect x="48" y="48" width="1096" height="526" class="box"/>

  <text x="96" y="112" font-size="24" class="mute">backend.how</text>
  <text x="96" y="186" font-size="58" font-weight="800" class="ink">1B Payments/Day</text>
  <text x="96" y="244" font-size="34" font-weight="600" class="ink">TigerBeetle &amp; PostgreSQL</text>

  <!-- PostgreSQL: each commit waits for its own WAL flush -->
  <text x="96" y="336" font-size="26" font-weight="700" class="ink">PostgreSQL</text>
  <g font-size="22" text-anchor="middle">
    <rect x="300" y="298" width="92" height="56" class="pay"/><text x="346" y="334" class="ink">1 tx</text><rect x="401" y="292" width="10" height="68" class="flush"/>
    <rect x="420" y="298" width="92" height="56" class="pay"/><text x="466" y="334" class="ink">1 tx</text><rect x="521" y="292" width="10" height="68" class="flush"/>
    <rect x="540" y="298" width="92" height="56" class="pay"/><text x="586" y="334" class="ink">1 tx</text><rect x="641" y="292" width="10" height="68" class="flush"/>
    <rect x="660" y="298" width="92" height="56" class="pay"/><text x="706" y="334" class="ink">1 tx</text><rect x="761" y="292" width="10" height="68" class="flush"/>
    <rect x="780" y="298" width="92" height="56" class="pay"/><text x="826" y="334" class="ink">1 tx</text><rect x="881" y="292" width="10" height="68" class="flush"/>
  </g>
  <text x="1104" y="284" font-size="22" text-anchor="end" class="mute">transfers/s</text>
  <text x="1104" y="338" font-size="34" font-weight="800" text-anchor="end" class="ink">3,356</text>

  <!-- TigerBeetle: one durable write for the whole batch -->
  <text x="96" y="430" font-size="26" font-weight="700" class="ink">TigerBeetle</text>
  <rect x="300" y="392" width="572" height="56" class="pay"/>
  <text x="586" y="428" font-size="24" text-anchor="middle" class="ink">8,190 transfers</text>
  <rect x="881" y="386" width="10" height="68" class="dur"/>
  <text x="1104" y="432" font-size="34" font-weight="800" text-anchor="end" class="ink">~48K</text>

  <!-- legend -->
  <rect x="96" y="494" width="10" height="34" class="flush"/>
  <text x="120" y="520" font-size="24" class="redt">WAL flush per commit</text>
  <rect x="520" y="494" width="10" height="34" class="dur"/>
  <text x="544" y="520" font-size="24" class="grnt">one durable write per batch</text>
</svg>
