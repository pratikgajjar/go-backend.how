<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img" aria-label="Four Postgres backends wait on WAL flushes. One flush runs at a time and covers every commit record inserted before it started.">
  <defs>
    <pattern id="h" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#555a63" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="720" height="262" fill="#fbfbf8"/>
  <text x="12" y="18" font-size="11" font-weight="800" fill="#14171c" letter-spacing="0.08em">GROUP COMMIT · 4 BACKENDS · MODEL</text>

  <!-- the label sits on the selected flush -->
  <text x="249" y="36" font-size="11" font-weight="800" fill="#7b2fb5" text-anchor="middle">one fdatasync → 2 commits durable</text>
  <line x1="249" y1="41" x2="249" y2="160" stroke="#7b2fb5" stroke-dasharray="2 3"/>

  <g font-size="10" fill="#555a63" text-anchor="end">
    <text x="84" y="58">backend 1</text><text x="84" y="84">backend 2</text>
    <text x="84" y="110">backend 3</text><text x="84" y="136">backend 4</text>
  </g>
  <text x="84" y="177" font-size="10" font-weight="800" fill="#14171c" text-anchor="end">WAL flush</text>

  <!-- lanes: a backend works (empty lane), then waits for a flush (hatched) -->
  <g stroke="#c5c8cc">
    <line x1="92" y1="54" x2="712" y2="54"/><line x1="92" y1="80" x2="712" y2="80"/>
    <line x1="92" y1="106" x2="712" y2="106"/><line x1="92" y1="132" x2="712" y2="132"/>
  </g>
  <g stroke="#14171c" stroke-width="0.8" fill="url(#h)">
    <rect x="379" y="47" width="143" height="14"/>
    <rect x="346" y="73" width="98" height="14"/><rect x="548" y="73" width="130" height="14"/>
    <rect x="438" y="99" width="84" height="14"/><rect x="587" y="99" width="91" height="14"/>
    <rect x="470" y="125" width="130" height="14"/>
  </g>
  <!-- made durable by the selected flush -->
  <g stroke="#7b2fb5" stroke-width="1.6" fill="#eadcf5">
    <rect x="197" y="47" width="91" height="14"/><rect x="204" y="73" width="84" height="14"/>
  </g>
  <!-- just missed it: inserted after the selected flush started -->
  <g stroke="#c0392b" stroke-width="1.6" stroke-dasharray="3 2" fill="#fbe3df">
    <rect x="249" y="99" width="117" height="14"/><rect x="275" y="125" width="91" height="14"/>
  </g>

  <!-- flushes run one at a time; the number is how many commits each one makes durable -->
  <g stroke="#14171c" stroke-width="1.2" fill="#fbfbf8">
    <rect x="288" y="160" width="78" height="26"/><rect x="366" y="160" width="78" height="26"/>
    <rect x="444" y="160" width="78" height="26"/><rect x="522" y="160" width="78" height="26"/>
    <rect x="600" y="160" width="78" height="26"/>
  </g>
  <rect x="210" y="160" width="78" height="26" fill="#eadcf5" stroke="#7b2fb5" stroke-width="2.4"/>
  <g font-size="11" font-weight="800" text-anchor="middle" fill="#14171c">
    <text x="249" y="177" fill="#7b2fb5">2</text><text x="327" y="177">2</text><text x="405" y="177">1</text>
    <text x="483" y="177">2</text><text x="561" y="177">1</text><text x="639" y="177">2</text>
  </g>

  <g font-size="11" fill="#14171c">
    <text x="12" y="220">The selected flush covers backends 1 and 2. Backends 3 and 4 insert their</text>
    <text x="12" y="236">commit records just after it starts (red), so they wait for the next flush.</text>
    <text x="12" y="252" fill="#555a63">Measured: 0.42 flushes per row with 8 backends, 0.76 per transfer with 10.</text>
  </g>
</svg>
