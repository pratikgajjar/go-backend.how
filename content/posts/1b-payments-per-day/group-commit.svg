<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img" aria-label="Four Postgres backends wait on WAL flushes. One flush runs at a time and covers every commit record inserted before it started.">
  <defs>
    <pattern id="h" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="#fbe3df"/>
      <line x1="0" y1="0" x2="0" y2="5" stroke="#c0392b" stroke-width="1.1"/>
    </pattern>
  </defs>
  <rect width="720" height="262" fill="#fbf7ec"/>
  <text x="12" y="18" font-size="11" font-weight="800" fill="#14171c" letter-spacing="0.08em">GROUP COMMIT · 4 BACKENDS · MODEL</text>

  <!-- time grid: one flush = 60 px -->
  <g stroke="#c5c8cc" stroke-dasharray="1 3">
    <line x1="210" y1="28" x2="210" y2="198"/><line x1="288" y1="28" x2="288" y2="198"/>
    <line x1="366" y1="28" x2="366" y2="198"/><line x1="444" y1="28" x2="444" y2="198"/>
    <line x1="522" y1="28" x2="522" y2="198"/><line x1="600" y1="28" x2="600" y2="198"/>
  </g>

  <!-- lanes: work (white), waiting for a flush (red hatch), commit durable (green tick) -->
  <g font-size="10" fill="#14171c" text-anchor="end">
    <text x="84" y="46">backend 1</text><text x="84" y="74">backend 2</text>
    <text x="84" y="102">backend 3</text><text x="84" y="130">backend 4</text>
    <text x="84" y="175" font-weight="800">WAL flush</text>
  </g>
  <g stroke="#14171c" stroke-width="0.9" fill="#fbf7ec">
    <rect x="106" y="33" width="91" height="17"/><rect x="288" y="33" width="91" height="17"/><rect x="522" y="33" width="104" height="17"/>
    <rect x="93" y="61" width="111" height="17"/><rect x="288" y="61" width="58" height="17"/><rect x="444" y="61" width="104" height="17"/>
    <rect x="119" y="89" width="130" height="17"/><rect x="366" y="89" width="72" height="17"/><rect x="522" y="89" width="65" height="17"/>
    <rect x="132" y="117" width="143" height="17"/><rect x="366" y="117" width="104" height="17"/>
  </g>
  <g stroke="#c0392b" stroke-width="0.9" fill="url(#h)">
    <rect x="197" y="33" width="91" height="17"/><rect x="379" y="33" width="143" height="17"/>
    <rect x="204" y="61" width="84" height="17"/><rect x="346" y="61" width="98" height="17"/><rect x="548" y="61" width="130" height="17"/>
    <rect x="249" y="89" width="117" height="17" stroke-width="2"/><rect x="438" y="89" width="84" height="17"/><rect x="587" y="89" width="91" height="17"/>
    <rect x="275" y="117" width="91" height="17" stroke-width="2"/><rect x="470" y="117" width="130" height="17"/>
  </g>
  <g stroke="#1e7a47" stroke-width="2.2">
    <line x1="288" y1="31" x2="288" y2="52"/><line x1="522" y1="31" x2="522" y2="52"/>
    <line x1="288" y1="59" x2="288" y2="80"/><line x1="444" y1="59" x2="444" y2="80"/><line x1="678" y1="59" x2="678" y2="80"/>
    <line x1="366" y1="87" x2="366" y2="108"/><line x1="522" y1="87" x2="522" y2="108"/><line x1="678" y1="87" x2="678" y2="108"/>
    <line x1="366" y1="115" x2="366" y2="136"/><line x1="600" y1="115" x2="600" y2="136"/>
  </g>

  <!-- flushes run one at a time; the number is how many commits each one makes durable -->
  <g stroke-width="1.2" font-size="11" font-weight="800" text-anchor="middle">
    <rect x="210" y="160" width="78" height="26" fill="#eadcf5" stroke="#7b2fb5" stroke-width="2.2"/><text x="249" y="177" fill="#7b2fb5">2</text>
    <rect x="288" y="160" width="78" height="26" fill="#d4efdd" stroke="#1e7a47"/><text x="327" y="177" fill="#1e7a47">2</text>
    <rect x="366" y="160" width="78" height="26" fill="#d4efdd" stroke="#1e7a47"/><text x="405" y="177" fill="#1e7a47">1</text>
    <rect x="444" y="160" width="78" height="26" fill="#d4efdd" stroke="#1e7a47"/><text x="483" y="177" fill="#1e7a47">2</text>
    <rect x="522" y="160" width="78" height="26" fill="#d4efdd" stroke="#1e7a47"/><text x="561" y="177" fill="#1e7a47">1</text>
    <rect x="600" y="160" width="78" height="26" fill="#d4efdd" stroke="#1e7a47"/><text x="639" y="177" fill="#1e7a47">2</text>
  </g>
  <rect x="210" y="26" width="78" height="164" fill="none" stroke="#7b2fb5" stroke-dasharray="3 3"/>

  <g font-size="11" fill="#14171c">
    <text x="12" y="220">The first flush covers backends 1 and 2. Backends 3 and 4 insert their commit</text>
    <text x="12" y="236">records while it runs (thick red), so they wait for the next flush.</text>
    <text x="12" y="252" fill="#555a63">Measured: 0.42 flushes per row with 8 backends, 0.76 per transfer with 10.</text>
  </g>
</svg>
