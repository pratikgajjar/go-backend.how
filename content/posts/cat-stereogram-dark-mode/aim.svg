<text x="409.1" y="161.5" font-size="12" fill="#2a2438" text-anchor="middle">cats 20 mm apart</text>
<line x1="44" y1="49.4" x2="409.1" y2="90.7" stroke="#c4302b" stroke-width="2"/>
<line x1="44" y1="112.1" x2="409.1" y2="70.8" stroke="#1f7896" stroke-width="2"/>
