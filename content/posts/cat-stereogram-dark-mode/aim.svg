<text x="32" y="37.4" font-size="12" font-weight="700" fill="#c4302b">left eye</text>
<text x="32" y="134.1" font-size="12" font-weight="700" fill="#1f7896">right eye</text>
<circle cx="321.1" cy="80.8" r="6" fill="#5b3f96"/>
