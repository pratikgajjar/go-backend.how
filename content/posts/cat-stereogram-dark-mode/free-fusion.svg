<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img" aria-label="Cross-eyed fusion of the cat pair printed on A4 at 40 cm: the lines of sight cross 149 mm from the eyes, and you see three cats">
<rect width="700" height="430" fill="#fbfbf7" stroke="#1b1e24" stroke-width="1.5"/>
<text x="20" y="28" font-size="12" font-weight="800" fill="#1b1e24" letter-spacing="1">FROM ABOVE</text>
<text x="370" y="28" font-size="12" font-weight="800" fill="#1b1e24" letter-spacing="1">WHAT YOU SEE</text>
<g transform="translate(20,34)">
<rect x="8" y="6" width="304" height="72" fill="#f1f1ec"/>
<text x="14" y="20" font-size="10" fill="#565b63">BEHIND THE PAGE</text>
<line x1="8" y1="78" x2="312" y2="78" stroke="#1b1e24" stroke-width="1.2"/>
<text x="308" y="72" font-size="10" font-weight="800" text-anchor="end" fill="#1b1e24">PAGE</text>
<rect x="55.4" y="73" width="90.5" height="10" fill="#ecdcf7" stroke="#6a2aa8" stroke-width="2"/>
<text x="100.6" y="100" font-size="10" font-weight="800" text-anchor="middle" fill="#6e4b2c" stroke="#fbfbf7" stroke-width="3.5" paint-order="stroke">left cat</text>
<rect x="174.1" y="73" width="90.5" height="10" fill="#ecdcf7" stroke="#6a2aa8" stroke-width="2"/>
<text x="219.4" y="100" font-size="10" font-weight="800" text-anchor="middle" fill="#6e4b2c" stroke="#fbfbf7" stroke-width="3.5" paint-order="stroke">right cat</text>
<line x1="124.7" y1="336" x2="219.4" y2="78" stroke="#1b1e24" stroke-width="1.5"/>
<circle cx="219.4" cy="78" r="4.5" fill="#6a2aa8" stroke="#fbfbf7" stroke-width="1.5"/>
<circle cx="124.7" cy="336" r="9" fill="#fbfbf7" stroke="#1b1e24" stroke-width="1.4"/>
<circle cx="124.7" cy="331" r="3" fill="#1b1e24"/>
<text x="124.7" y="360" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1b1e24">L</text>
<line x1="195.3" y1="336" x2="100.6" y2="78" stroke="#1b1e24" stroke-width="1.5"/>
<circle cx="100.6" cy="78" r="4.5" fill="#6a2aa8" stroke="#fbfbf7" stroke-width="1.5"/>
<circle cx="195.3" cy="336" r="9" fill="#fbfbf7" stroke="#1b1e24" stroke-width="1.4"/>
<circle cx="195.3" cy="331" r="3" fill="#1b1e24"/>
<text x="195.3" y="360" font-size="11.5" font-weight="800" text-anchor="middle" fill="#1b1e24">R</text>
<circle cx="160" cy="239.8" r="6" fill="#ecdcf7" stroke="#6a2aa8" stroke-width="2"/>
<text x="171" y="243.8" font-size="11.5" font-weight="800" fill="#6a2aa8">finger · 149 mm</text>
<text x="160" y="360" font-size="10" text-anchor="middle" fill="#565b63">63 mm</text>
<text x="12" y="360" font-size="10" fill="#565b63">widths ×1.7</text>
<line x1="16" y1="108" x2="16" y2="326" stroke="#c7c9cd"/>
<text x="22" y="237" font-size="10" fill="#565b63">40 cm</text>
</g>
<g transform="translate(360,60)">
<g transform="translate(65.0,84) scale(0.03998,0.03998)" fill="none" stroke="#6e4b2c"><circle cx="0" cy="-1240" r="354.5" stroke-width="121"/><circle cx="0" cy="0" r="887" stroke-width="133"/><path d="M-224,-1858 L-275,-1545 L-180,-1620 Z" fill="#6e4b2c" stroke="none"/><line x1="-716" y1="-1338" x2="-406" y2="-1273" stroke-width="34"/><line x1="-716" y1="-1273" x2="-406" y2="-1265" stroke-width="34"/><line x1="-709" y1="-1195" x2="-406" y2="-1253" stroke-width="34"/><path d="M-6,947 L-6,1137 C-6,1247 -106,1287 -206,1284 C-356,1277 -556,1057 -756,1037 C-926,1022 -1056,1157 -1056,1338" stroke-width="97"/></g>
<g transform="translate(165.0,84) scale(-0.03998,0.03998)" fill="none" stroke="#6a2aa8"><circle cx="0" cy="-1240" r="354.5" stroke-width="121"/><circle cx="0" cy="0" r="887" stroke-width="133"/><path d="M-224,-1858 L-275,-1545 L-180,-1620 Z" fill="#6a2aa8" stroke="none"/><line x1="-716" y1="-1338" x2="-406" y2="-1273" stroke-width="34"/><line x1="-716" y1="-1273" x2="-406" y2="-1265" stroke-width="34"/><line x1="-709" y1="-1195" x2="-406" y2="-1253" stroke-width="34"/></g>
<g transform="translate(165.0,84) scale(0.03998,0.03998)" fill="none" stroke="#6a2aa8"><circle cx="0" cy="-1240" r="354.5" stroke-width="121"/><circle cx="0" cy="0" r="887" stroke-width="133"/><path d="M-224,-1858 L-275,-1545 L-180,-1620 Z" fill="#6a2aa8" stroke="none"/><line x1="-716" y1="-1338" x2="-406" y2="-1273" stroke-width="34"/><line x1="-716" y1="-1273" x2="-406" y2="-1265" stroke-width="34"/><line x1="-709" y1="-1195" x2="-406" y2="-1253" stroke-width="34"/><path d="M-6,947 L-6,1137 C-6,1247 -106,1287 -206,1284 C-356,1277 -556,1057 -756,1037 C-926,1022 -1056,1157 -1056,1338" stroke-width="97"/></g>
<g transform="translate(265.0,84) scale(-0.03998,0.03998)" fill="none" stroke="#6e4b2c" stroke-dasharray="160 70"><circle cx="0" cy="-1240" r="354.5" stroke-width="121"/><circle cx="0" cy="0" r="887" stroke-width="133"/><path d="M-224,-1858 L-275,-1545 L-180,-1620 Z" fill="#6e4b2c" stroke="none"/><line x1="-716" y1="-1338" x2="-406" y2="-1273" stroke-width="34"/><line x1="-716" y1="-1273" x2="-406" y2="-1265" stroke-width="34"/><line x1="-709" y1="-1195" x2="-406" y2="-1253" stroke-width="34"/></g>
<text x="65.0" y="176" font-size="10" font-weight="800" text-anchor="middle" fill="#6e4b2c">L eye</text>
<text x="165.0" y="176" font-size="10" font-weight="800" text-anchor="middle" fill="#6a2aa8">L+R · fused</text>
<text x="265.0" y="176" font-size="10" font-weight="800" text-anchor="middle" fill="#6e4b2c">R eye</text>
<rect x="162.0" y="150" width="6" height="16" rx="3" fill="#6a2aa8"/>
</g>
<text x="370" y="272" font-size="12" fill="#1b1e24">A4 print: cats 106 mm apart, 40 cm away.</text>
<text x="370" y="291" font-size="12" fill="#1b1e24">Eyes 63 mm apart cross 149 mm out.</text>
<text x="370" y="310" font-size="12" fill="#1b1e24">Hold the fingertip there and look at it.</text>
<text x="370" y="329" font-size="12" fill="#1b1e24">Left eye lands on the right cat, right</text>
<text x="370" y="348" font-size="12" fill="#1b1e24">eye on the left cat. The middle cat gets</text>
<text x="370" y="367" font-size="12" fill="#1b1e24">both ears, both whiskers, and the tail.</text>
<rect x="364" y="258" width="3" height="118" fill="#1d6a3f"/>
</svg>
