<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); }
    .red { fill: var(--red); } .green { fill: var(--green); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .mark { fill: var(--board); stroke: var(--ink); stroke-width: 2; stroke-dasharray: 7 5; }
    .hit { fill: var(--red-l); stroke: var(--red); stroke-width: 2.5; stroke-dasharray: 7 5; }
    .nokey { fill: var(--board); stroke: var(--red); stroke-width: 2.5; stroke-dasharray: 7 5; }
    .key { fill: var(--green-l); stroke: var(--green); stroke-width: 2.5; stroke-dasharray: 7 5; }
    .arr { stroke: var(--ink); stroke-width: 2.5; fill: none; }
    text { font-family: var(--font-mono); }
  </style>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1104" height="526" class="ink"/>
  <rect x="48" y="48" width="1104" height="526" class="box"/>

  <text x="96" y="112" font-size="24" class="mute">backend.how</text>
  <text x="96" y="186" font-size="58" font-weight="800" class="ink">Lost SSH Access to Ec2 ?</text>
  <text x="96" y="240" font-size="34" font-weight="600" class="ink">Add a new key through EC2 user data</text>

  <!-- column heads -->
  <g font-size="22" class="mute">
    <text x="96" y="300">user data</text>
    <text x="456" y="300">marker on disk</text>
    <text x="872" y="300">authorized_keys</text>
  </g>

  <!-- row 1: key alone, init marker exists since launch, module skips -->
  <rect x="96" y="318" width="300" height="86" class="mark"/>
  <text x="114" y="354" font-size="22" class="ink">users: new key</text>
  <text x="114" y="386" font-size="22" class="mute">(nothing else)</text>
  <path d="M396 361 h44" class="arr"/><path d="M448 361 l-12 -7 v14 z" class="ink"/>
  <rect x="456" y="318" width="360" height="86" class="hit"/>
  <text x="474" y="354" font-size="22" class="ink">config_users_groups</text>
  <text x="474" y="386" font-size="22" font-weight="700" class="red">exists → skip</text>
  <path d="M816 361 h40" class="arr"/><path d="M864 361 l-12 -7 v14 z" class="ink"/>
  <rect x="872" y="318" width="232" height="86" class="nokey"/>
  <text x="988" y="368" font-size="22" font-weight="700" text-anchor="middle" class="red">no new key</text>

  <!-- row 2: with cloud_final_modules [users-groups, once], new marker missing, module runs -->
  <rect x="96" y="424" width="300" height="86" class="mark"/>
  <text x="114" y="460" font-size="22" class="ink">users: new key</text>
  <text x="114" y="492" font-size="22" font-weight="700" class="ink">[users-groups, once]</text>
  <path d="M396 467 h44" class="arr"/><path d="M448 467 l-12 -7 v14 z" class="ink"/>
  <rect x="456" y="424" width="360" height="86" class="mark"/>
  <text x="474" y="460" font-size="22" class="ink">config_users_groups.once</text>
  <text x="474" y="492" font-size="22" font-weight="700" class="mute">missing → run</text>
  <path d="M816 467 h40" class="arr"/><path d="M864 467 l-12 -7 v14 z" class="ink"/>
  <rect x="872" y="424" width="232" height="86" class="key"/>
  <text x="988" y="474" font-size="22" font-weight="700" text-anchor="middle" class="green">+ new key</text>
</svg>
