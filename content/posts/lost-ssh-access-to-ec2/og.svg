<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); }
    .red { fill: var(--red); } .green { fill: var(--green); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .mark { fill: var(--board); stroke: var(--ink); stroke-width: 2; stroke-dasharray: 7 5; }
    .hit { fill: var(--red-l); stroke: var(--red); stroke-width: 2.5; stroke-dasharray: 7 5; }
    .nokey { fill: var(--board); stroke: var(--red); stroke-width: 2.5; stroke-dasharray: 7 5; }
    .key { fill: var(--green-l); stroke: var(--green); stroke-width: 2.5; stroke-dasharray: 7 5; }
    .arr { stroke: var(--ink); stroke-width: 2.5; fill: none; }
    text { font-family: var(--font-mono); }
  </style>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1104" height="526" class="ink"/>
  <rect x="48" y="48" width="1104" height="526" class="box"/>

  <text x="96" y="116" font-size="28" class="mute">backend.how</text>
  <text x="96" y="186" font-size="58" font-weight="800" class="ink">Lost SSH Access to Ec2 ?</text>
  <text x="96" y="240" font-size="34" font-weight="600" class="ink">Add a new key through EC2 user data</text>

  <g font-size="28">
    <!-- row 1: key alone, init marker exists since launch, module skips -->
    <rect x="96" y="284" width="372" height="104" class="mark"/>
    <text x="116" y="346" class="ink">users: new key</text>
    <path d="M468 336 h34" class="arr"/><path d="M514 336 l-12 -7 v14 z" class="ink"/>
    <rect x="516" y="284" width="300" height="104" class="hit"/>
    <text x="536" y="328" class="ink">marker exists</text>
    <text x="536" y="366" font-weight="700" class="red">→ skip</text>
    <path d="M816 336 h34" class="arr"/><path d="M862 336 l-12 -7 v14 z" class="ink"/>
    <rect x="864" y="284" width="240" height="104" class="nokey"/>
    <text x="984" y="346" font-weight="700" text-anchor="middle" class="red">no new key</text>

    <!-- row 2: with cloud_final_modules [users-groups, once], new marker missing, module runs -->
    <rect x="96" y="408" width="372" height="104" class="mark"/>
    <text x="116" y="452" class="ink">users: new key</text>
    <text x="116" y="490" font-weight="700" class="ink">[users-groups, once]</text>
    <path d="M468 460 h34" class="arr"/><path d="M514 460 l-12 -7 v14 z" class="ink"/>
    <rect x="516" y="408" width="300" height="104" class="mark"/>
    <text x="536" y="452" class="ink">marker missing</text>
    <text x="536" y="490" font-weight="700" class="ink">→ run</text>
    <path d="M816 460 h34" class="arr"/><path d="M862 460 l-12 -7 v14 z" class="ink"/>
    <rect x="864" y="408" width="240" height="104" class="key"/>
    <text x="984" y="470" font-weight="700" text-anchor="middle" class="green">+ new key</text>
  </g>
</svg>
