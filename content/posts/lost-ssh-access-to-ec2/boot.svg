<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11.5" role="img" aria-label="One recovery boot as a cloud-init log and the files it touches: users_groups is skipped because its per-instance marker exists, users-groups runs with frequency once and creates config_users_groups.once, and the new key is appended to authorized_keys (92 to 184 bytes).">
  <rect width="900" height="420" rx="8" fill="#161e25"/>
  <!-- console -->
  <rect x="16" y="16" width="452" height="388" rx="4" fill="#0b1219" stroke="#424f5a"/>
  <text x="28" y="36" font-size="10.5" fill="#e7ecf0" letter-spacing="0.6">CONSOLE · /VAR/LOG/CLOUD-INIT.LOG</text>
  <line x1="16" y1="46" x2="468" y2="46" stroke="#424f5a"/>
  <g fill="#a7b3bd">
    <text x="28" y="68" fill="#ff8175" font-weight="700">ubuntu@203.0.113.10: Permission denied (publickey).</text>
    <text x="28" y="92" font-style="italic"># stop, edit user data, start</text>
    <text x="28" y="116">consume_data already ran</text>
    <text x="40" y="132">(freq=once-per-instance)</text>
    <text x="28" y="152">Writing to /var/lib/cloud/instances/</text>
    <text x="40" y="168">&lt;id&gt;/cloud-config.txt - 264 bytes</text>
    <text x="28" y="192">Running module users_groups</text>
    <text x="40" y="208">with frequency once-per-instance</text>
    <text x="28" y="226" fill="#ff8175" font-weight="700">config-users_groups already ran</text>
    <text x="40" y="242" fill="#ff8175" font-weight="700">(freq=once-per-instance)</text>
    <text x="28" y="266" fill="#e7ecf0">Running module users-groups with frequency once</text>
    <text x="28" y="284" fill="#e7ecf0">Writing to /var/lib/cloud/sem/</text>
    <text x="40" y="300" fill="#e7ecf0">config_users_groups.once - 24 bytes</text>
    <text x="28" y="324" fill="#71d790" font-weight="700">Writing to /home/ubuntu/.ssh/</text>
    <text x="40" y="340" fill="#71d790" font-weight="700">authorized_keys - 184 bytes</text>
    <text x="28" y="364" fill="#e7ecf0" font-weight="700">$ ssh -i ~/.ssh/new ubuntu@198.51.100.24</text>
    <text x="28" y="382" fill="#71d790" font-weight="700">ubuntu@ip-172-31-5-20:~$</text>
  </g>
  <!-- tree -->
  <rect x="484" y="16" width="400" height="388" rx="4" fill="#0b1219" stroke="#424f5a"/>
  <text x="496" y="36" font-size="10.5" fill="#e7ecf0" letter-spacing="0.6">ROOT VOLUME (EBS)</text>
  <line x1="484" y1="46" x2="884" y2="46" stroke="#424f5a"/>
  <g fill="#e7ecf0" xml:space="preserve">
    <text x="496" y="70">/var/lib/cloud/</text>
    <text x="496" y="90"><tspan fill="#a7b3bd">├── </tspan>instances/&lt;id&gt;/</text>
    <text x="496" y="110"><tspan fill="#a7b3bd">│   ├── </tspan>cloud-config.txt</text>
    <text x="496" y="130"><tspan fill="#a7b3bd">│   └── </tspan>sem/</text>
    <text x="496" y="150"><tspan fill="#a7b3bd">│       ├── </tspan>consume_data</text>
    <rect x="488" y="157" width="392" height="18" fill="#5e211f"/>
    <text x="496" y="170"><tspan fill="#a7b3bd">│       ├── </tspan><tspan fill="#ff8175" font-weight="800">config_users_groups ← skip</tspan></text>
    <text x="496" y="190"><tspan fill="#a7b3bd">│       └── </tspan>… 17 more markers</text>
    <text x="496" y="210"><tspan fill="#a7b3bd">└── </tspan>sem/</text>
    <text x="496" y="230"><tspan fill="#a7b3bd">    ├── </tspan>config_scripts_per_once.once</text>
    <rect x="488" y="237" width="392" height="18" fill="#164225"/>
    <text x="496" y="250"><tspan fill="#a7b3bd">    └── </tspan><tspan fill="#71d790" font-weight="800">config_users_groups.once ← new</tspan></text>
    <text x="496" y="290">/home/ubuntu/.ssh/</text>
    <text x="496" y="310"><tspan fill="#a7b3bd">└── </tspan>authorized_keys  <tspan fill="#d1a8ff" font-weight="800">92 → 184 bytes</tspan></text>
    <text x="496" y="330" fill="#edbd86">      1  ssh-ed25519 …Pcno old@laptop</text>
    <rect x="488" y="337" width="392" height="18" fill="#164225"/>
    <text x="496" y="350" fill="#71d790" font-weight="800">      2  ssh-ed25519 …Iosi new@laptop</text>
  </g>
</svg>
