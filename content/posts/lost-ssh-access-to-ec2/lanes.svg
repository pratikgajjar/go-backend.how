<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="JetBrains Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11" role="img" aria-label="Three options across three boots. No override: the key is never added. once: the key is added on the first recovery, then a second recovery is skipped because the .once marker is still on disk. always: the key is added on both recoveries. With once or always set, the rest of the final stage is skipped.">
  <rect width="760" height="360" rx="8" fill="#161e25"/>
  <g fill="#e7ecf0" font-weight="800" font-size="12">
    <text x="206" y="30">recovery</text><text x="390" y="30">reboot</text><text x="574" y="30">2nd recovery</text>
  </g>
  <line x1="200" y1="40" x2="744" y2="40" stroke="#424f5a"/>
  <!-- lane headers -->
  <rect x="16" y="50" width="172" height="90" rx="4" fill="none" stroke="#83c0ff" stroke-width="1.5"/>
  <text x="28" y="72" font-size="13" font-weight="800" fill="#83c0ff">no override</text>
  <text x="28" y="90" font-size="10.5" fill="#83c0ff">users: block only</text>
  <text x="28" y="128" font-size="10.5" font-weight="700" fill="#71d790">final stage runs</text>
  <rect x="16" y="150" width="172" height="90" rx="4" fill="#5f330f" stroke="#ffab59" stroke-width="2.5"/>
  <text x="28" y="172" font-size="13" font-weight="800" fill="#ffab59">once · this post</text>
  <text x="28" y="190" font-size="10.5" fill="#ffab59">[users-groups, once]</text>
  <text x="28" y="228" font-size="10.5" font-weight="700" fill="#ff8175">rest of final skipped</text>
  <rect x="16" y="250" width="172" height="90" rx="4" fill="none" stroke="#83c0ff" stroke-width="1.5"/>
  <text x="28" y="272" font-size="13" font-weight="800" fill="#83c0ff">always</text>
  <text x="28" y="290" font-size="10.5" fill="#83c0ff">[users-groups, always]</text>
  <text x="28" y="328" font-size="10.5" font-weight="700" fill="#ff8175">rest of final skipped</text>
  <!-- cells: x 200, 384, 568; w 176 -->
  <g>
    <rect x="200" y="50" width="176" height="90" rx="4" fill="#212a32" stroke="#ff8175" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="384" y="50" width="176" height="90" rx="4" fill="#212a32" stroke="#ff8175" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="568" y="50" width="176" height="90" rx="4" fill="#212a32" stroke="#ff8175" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="200" y="150" width="176" height="90" rx="4" fill="#212a32" stroke="#71d790" stroke-width="1.5"/>
    <rect x="384" y="150" width="176" height="90" rx="4" fill="#212a32" stroke="#424f5a"/>
    <rect x="568" y="150" width="176" height="90" rx="4" fill="#212a32" stroke="#ff8175" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="200" y="250" width="176" height="90" rx="4" fill="#212a32" stroke="#71d790" stroke-width="1.5"/>
    <rect x="384" y="250" width="176" height="90" rx="4" fill="#212a32" stroke="#424f5a"/>
    <rect x="568" y="250" width="176" height="90" rx="4" fill="#212a32" stroke="#71d790" stroke-width="1.5"/>
  </g>
  <g font-weight="800" font-size="12.5">
    <text x="210" y="70" fill="#ff8175">skipped</text><text x="394" y="70" fill="#ff8175">skipped</text><text x="578" y="70" fill="#ff8175">skipped</text>
    <text x="210" y="170" fill="#71d790">added</text><text x="394" y="170" fill="#e7ecf0">no change</text><text x="578" y="170" fill="#ff8175">skipped</text>
    <text x="210" y="270" fill="#71d790">added</text><text x="394" y="270" fill="#e7ecf0">rewritten</text><text x="578" y="270" fill="#71d790">added</text>
  </g>
  <g fill="#edbd86">
    <text x="210" y="90">old</text><text x="210" y="106" fill="#ff8175" font-weight="800">new ✗</text>
    <text x="394" y="90">old</text><text x="394" y="106" fill="#ff8175" font-weight="800">new ✗</text>
    <text x="578" y="90">old</text><text x="578" y="106" fill="#ff8175" font-weight="800">newer ✗</text>
    <text x="210" y="190">old</text><text x="210" y="206" fill="#71d790" font-weight="800">new +</text><text x="210" y="228" font-size="10" fill="#71d790">.once marker (new)</text>
    <text x="394" y="190">old</text><text x="394" y="206">new</text><text x="394" y="228" font-size="10">.once marker</text>
    <text x="578" y="190">old</text><text x="578" y="206">new</text><text x="578" y="222" fill="#ff8175" font-weight="800">newer ✗</text><text x="660" y="190" font-size="10" fill="#ff8175" font-weight="800">.once blocks</text>
    <text x="210" y="290">old</text><text x="210" y="306" fill="#71d790" font-weight="800">new +</text>
    <text x="394" y="290">old</text><text x="394" y="306">new</text>
    <text x="578" y="290">old</text><text x="578" y="306">new</text><text x="578" y="322" fill="#71d790" font-weight="800">newer +</text>
  </g>
</svg>
