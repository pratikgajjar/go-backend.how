<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .cell { fill: var(--board); stroke: var(--ink); stroke-width: 2; }
    .best { fill: var(--green-l); stroke: var(--green); stroke-width: 2.5; }
    .worst { fill: var(--red-l); stroke: var(--red); stroke-width: 2.5; }
    text { font-family: var(--font-mono); }
  </style>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1096" height="526" class="ink"/>
  <rect x="48" y="48" width="1096" height="526" class="box"/>

  <text x="96" y="112" font-size="24" class="mute">backend.how</text>
  <text x="96" y="180" font-size="56" font-weight="800" class="ink">LMDB vs Pebble vs BoltDB</text>
  <text x="96" y="232" font-size="34" font-weight="600" class="ink">B-Tree-on-SSD, Three Ways</text>

  <!-- column heads -->
  <g font-size="24" text-anchor="middle" class="mute">
    <text x="385" y="286">writes/sec</text>
    <text x="667" y="286">read p50</text>
    <text x="949" y="286">on disk</text>
  </g>

  <!-- one row per engine; green = best on that axis, red = worst -->
  <g font-size="26" font-weight="700" class="ink">
    <text x="96" y="339">LMDB</text>
    <text x="96" y="403">BoltDB</text>
    <text x="96" y="467">Pebble</text>
  </g>
  <g font-size="26" text-anchor="middle" class="ink">
    <rect x="250" y="302" width="270" height="56" class="best"/><text x="385" y="339">1.93M</text>
    <rect x="532" y="302" width="270" height="56" class="best"/><text x="667" y="339">430 ns</text>
    <rect x="814" y="302" width="270" height="56" class="cell"/><text x="949" y="339">42 MiB</text>

    <rect x="250" y="366" width="270" height="56" class="worst"/><text x="385" y="403">73K</text>
    <rect x="532" y="366" width="270" height="56" class="cell"/><text x="667" y="403">459 ns</text>
    <rect x="814" y="366" width="270" height="56" class="worst"/><text x="949" y="403">96 MiB</text>

    <rect x="250" y="430" width="270" height="56" class="cell"/><text x="385" y="467">635K</text>
    <rect x="532" y="430" width="270" height="56" class="worst"/><text x="667" y="467">5.4 μs</text>
    <rect x="814" y="430" width="270" height="56" class="best"/><text x="949" y="467">20 MiB</text>
  </g>

  <text x="96" y="526" font-size="24" class="ink">Green is best, red is worst. No engine is best on all three.</text>
</svg>
