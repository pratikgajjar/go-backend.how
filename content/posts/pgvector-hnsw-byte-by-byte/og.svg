<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .row { stroke: var(--line); stroke-width: 2; stroke-dasharray: 7 5; }
    .node { fill: var(--board); stroke: var(--ink); stroke-width: 3; }
    .hit { fill: var(--orange-l); stroke: var(--orange); stroke-width: 3; }
    .beam { fill: none; stroke: var(--orange); stroke-width: 2.5; stroke-dasharray: 8 6; }
    .q { fill: var(--orange); }
    .path { fill: none; stroke: var(--purple); stroke-width: 4; }
    .head { fill: var(--purple); }
    text { font-family: var(--font-mono); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" class="head"/>
    </marker>
  </defs>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1096" height="526" class="ink"/>
  <rect x="48" y="48" width="1096" height="526" class="box"/>

  <text x="96" y="108" font-size="24" class="mute">backend.how</text>
  <text x="96" y="176" font-size="58" font-weight="800" class="ink">pgvector Under the Hood</text>
  <text x="96" y="226" font-size="34" font-weight="600" class="ink">HNSW in 800 lines of C</text>

  <!-- three graph layers: few nodes on top, every node on layer 0 -->
  <g font-size="24" class="mute">
    <text x="96" y="308">layer 2</text>
    <text x="96" y="380">layer 1</text>
    <text x="96" y="452">layer 0</text>
  </g>
  <line x1="236" y1="300" x2="1096" y2="300" class="row"/>
  <line x1="236" y1="372" x2="1096" y2="372" class="row"/>
  <line x1="236" y1="444" x2="1096" y2="444" class="row"/>

  <!-- search: greedy hop on each upper layer, drop down, beam on layer 0 -->
  <path d="M326 286 Q550 236 770 286" class="path" marker-end="url(#a)"/>
  <path d="M790 316 V352" class="path" marker-end="url(#a)"/>
  <path d="M806 358 Q873 326 936 358" class="path" marker-end="url(#a)"/>
  <path d="M950 388 V418" class="path" marker-end="url(#a)"/>

  <circle cx="310" cy="300" r="13" class="node"/>
  <circle cx="790" cy="300" r="13" class="node"/>

  <circle cx="310" cy="372" r="13" class="node"/>
  <circle cx="550" cy="372" r="13" class="node"/>
  <circle cx="790" cy="372" r="13" class="node"/>
  <circle cx="950" cy="372" r="13" class="node"/>

  <circle cx="310" cy="444" r="13" class="node"/>
  <circle cx="430" cy="444" r="13" class="node"/>
  <circle cx="550" cy="444" r="13" class="node"/>
  <circle cx="670" cy="444" r="13" class="node"/>
  <circle cx="790" cy="444" r="13" class="node"/>
  <rect x="862" y="416" width="230" height="58" rx="29" class="beam"/>
  <circle cx="890" cy="444" r="13" class="hit"/>
  <circle cx="950" cy="444" r="13" class="hit"/>
  <circle cx="1064" cy="444" r="13" class="hit"/>
  <path d="M1007 432 l12 20 h-24 z" class="q"/>

  <text x="310" y="266" font-size="24" text-anchor="middle" class="ink">entry</text>

  <text x="96" y="522" font-size="26" class="ink">382 µs at 94.6 % recall@10. Full scan: 5,440 µs.</text>
  <path d="M977 502 l12 20 h-24 z" class="q"/>
  <text x="1004" y="522" font-size="26" class="mute">query</text>
</svg>
