<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .seg { fill: var(--board); stroke: var(--ink); stroke-width: 2; }
    .done { fill: var(--green-l); stroke: var(--green); stroke-width: 2.5; }
    .wait { fill: var(--board); stroke: var(--ink); stroke-width: 2; stroke-dasharray: 7 5; }
    .ack { fill: var(--purple); } .ackl { stroke: var(--purple); stroke-width: 4; }
    text { font-family: var(--font-mono); }
  </style>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1104" height="526" class="ink"/>
  <rect x="48" y="48" width="1104" height="526" class="box"/>

  <text x="96" y="116" font-size="28" class="mute">backend.how</text>
  <text x="96" y="190" font-size="58" font-weight="800" class="ink">WAL Cake</text>
  <text x="96" y="246" font-size="34" font-weight="600" class="ink">Ordered ACKs from parallel S3 uploads</text>

  <!-- six WAL segments, uploads finish out of order -->
  <g font-size="34" font-weight="700" text-anchor="middle">
    <rect x="96"  y="318" width="152" height="100" class="done"/><text x="172" y="380" class="ink">S1 ✓</text>
    <rect x="264" y="318" width="152" height="100" class="done"/><text x="340" y="380" class="ink">S2 ✓</text>
    <rect x="432" y="318" width="152" height="100" class="wait"/><text x="508" y="380" class="mute">S3 …</text>
    <rect x="600" y="318" width="152" height="100" class="done"/><text x="676" y="380" class="ink">S4 ✓</text>
    <rect x="768" y="318" width="152" height="100" class="done"/><text x="844" y="380" class="ink">S5 ✓</text>
    <rect x="936" y="318" width="152" height="100" class="seg"/><text x="1012" y="380" class="mute">S6</text>
  </g>

  <!-- ACK pointer stops at the end of the contiguous prefix -->
  <line x1="424" y1="296" x2="424" y2="444" class="ackl"/>
  <path d="M424 452 l-12 -18 h24 z" class="ack"/>
  <text x="96" y="512" font-size="32" font-weight="600" class="ink">ACK only a contiguous prefix</text>
</svg>
