<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .proc { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .rec { fill: var(--tint); stroke: var(--ink); stroke-width: 2; stroke-dasharray: 7 5; }
    .msg { fill: var(--brown-l); stroke: var(--brown); stroke-width: 3; stroke-dasharray: 7 5; }
    .brown { fill: var(--brown); } .purple { fill: var(--purple); }
    .pwire { stroke: var(--purple); stroke-width: 3; fill: none; }
    .wire { stroke: var(--ink); stroke-width: 3; fill: none; }
    text { font-family: var(--font-mono); }
  </style>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1096" height="526" class="ink"/>
  <rect x="48" y="48" width="1096" height="526" class="box"/>

  <text x="96" y="118" font-size="28" class="mute">backend.how</text>
  <text x="96" y="192" font-size="58" font-weight="800" class="ink">The Outbox Without an Outbox</text>
  <text x="96" y="248" font-size="32" font-weight="600" class="ink">Events in the Postgres WAL instead of a table</text>

  <!-- one transaction's WAL records: the event is a record like the row -->
  <g font-size="28" text-anchor="middle">
    <rect x="96"  y="306" width="148" height="80" class="rec"/><text x="170" y="356" class="ink">INSERT</text>
    <rect x="244" y="306" width="164" height="80" class="msg"/><text x="326" y="356" font-weight="800" class="brown">MESSAGE</text>
    <rect x="408" y="306" width="148" height="80" class="rec"/><text x="482" y="356" class="ink">COMMIT</text>
  </g>

  <!-- bracket: all three records belong to one transaction -->
  <path d="M96 400 v10 h460 v-10" class="wire"/>
  <text x="326" y="446" font-size="28" text-anchor="middle" class="mute">one transaction</text>

  <!-- consumer reads the slot and produces to Kafka -->
  <line x1="562" y1="346" x2="676" y2="346" class="pwire"/>
  <path d="M690 346 l-18 -11 v22 z" class="purple"/>
  <text x="622" y="330" font-size="28" font-weight="700" text-anchor="middle" class="purple">slot</text>
  <rect x="694" y="306" width="170" height="80" class="proc"/>
  <text x="779" y="356" font-size="28" text-anchor="middle" class="ink">OwlPost</text>
  <line x1="864" y1="346" x2="916" y2="346" class="wire"/>
  <path d="M930 346 l-18 -11 v22 z" class="ink"/>
  <rect x="934" y="306" width="140" height="80" class="proc"/>
  <text x="1004" y="356" font-size="28" text-anchor="middle" class="ink">Kafka</text>

  <text x="96" y="510" font-size="30" class="ink">COMMIT sends the event. ROLLBACK drops it.</text>
</svg>
