<text x="60" y="122" font-size="11" text-anchor="start" fill="#181119">10,000 events/s × 616 B + 5 MB/s other WAL = 11.2 MB/s kept behind a stalled slot.</text>
<text x="60" y="142" font-size="11" font-weight="800" text-anchor="start" fill="#be1219">Kafka can be down for 16 min before max_slot_wal_keep_size = 10GB invalidates the slot.</text>
<text x="60" y="158" font-size="11" font-weight="800" text-anchor="start" fill="#be1219">After that, OwlPost cannot stream from it; events in the removed WAL need a backfill.</text>
