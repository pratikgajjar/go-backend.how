<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .job { fill: var(--board); stroke: var(--ink); stroke-width: 2; }
    .local { fill: var(--green-l); stroke: var(--green); stroke-width: 2.5; }
    .cloud { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; stroke-dasharray: 9 6; }
    .wire { stroke: var(--brown); stroke-width: 4; } .tip { fill: var(--brown); }
    .data { fill: var(--brown); }
    text { font-family: var(--font-mono); }
  </style>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1104" height="526" class="ink"/>
  <rect x="48" y="48" width="1104" height="526" class="box"/>

  <text x="96" y="116" font-size="28" class="mute">backend.how</text>
  <text x="96" y="186" font-size="56" font-weight="800" class="ink">Designing a robot</text>
  <text x="96" y="250" font-size="56" font-weight="800" class="ink">that talks with kids</text>

  <!-- local half: the robot's own jobs -->
  <rect x="96" y="296" width="560" height="230" class="local"/>
  <text x="120" y="342" font-size="30" font-weight="800" class="ink">on the robot</text>
  <g font-size="30" font-weight="700" text-anchor="middle">
    <rect x="120" y="366" width="116" height="72" class="job"/><text x="178" y="412" class="ink">hear</text>
    <rect x="252" y="366" width="116" height="72" class="job"/><text x="310" y="412" class="ink">see</text>
    <rect x="384" y="366" width="116" height="72" class="job"/><text x="442" y="412" class="ink">talk</text>
    <rect x="516" y="366" width="116" height="72" class="job"/><text x="574" y="412" class="ink">move</text>
  </g>
  <text x="120" y="496" font-size="28" class="ink">milliseconds, works offline</text>

  <!-- the link between the halves -->
  <line x1="672" y1="430" x2="752" y2="430" class="wire"/>
  <path d="M662 430 l16 -11 v22 z M762 430 l-16 -11 v22 z" class="tip"/>
  <text x="712" y="408" font-size="28" font-weight="700" text-anchor="middle" class="data">Wi-Fi</text>

  <!-- cloud half -->
  <rect x="768" y="296" width="336" height="230" class="cloud"/>
  <text x="792" y="342" font-size="30" font-weight="800" class="ink">in the cloud</text>
  <g font-size="30" font-weight="700" text-anchor="middle">
    <rect x="792" y="366" width="288" height="60" class="job"/><text x="936" y="406" class="ink">speech to text</text>
    <rect x="792" y="438" width="288" height="60" class="job"/><text x="936" y="478" class="ink">LLM</text>
  </g>
</svg>
