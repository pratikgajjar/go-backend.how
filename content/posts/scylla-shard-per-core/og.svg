<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .core { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .hot { fill: var(--red-l); stroke: var(--red); stroke-width: 2.5; stroke-dasharray: 7 5; }
    .own { fill: var(--green-l); stroke: var(--green); stroke-width: 2.5; stroke-dasharray: 7 5; }
    .hotl { stroke: var(--red); stroke-width: 3; }
    .ownl { stroke: var(--green); stroke-width: 3; }
    .red { fill: var(--red); } .green { fill: var(--green); }
    text { font-family: var(--font-mono); }
  </style>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1096" height="526" class="ink"/>
  <rect x="48" y="48" width="1096" height="526" class="box"/>

  <text x="96" y="112" font-size="24" class="mute">backend.how</text>
  <text x="96" y="186" font-size="58" font-weight="800" class="ink">Scylla Shard-per-Core</text>
  <text x="96" y="238" font-size="32" font-weight="600" class="ink">A Benchmark of Why Pinning Beats Your Go Server</text>

  <!-- left: four cores write one shared cache line -->
  <g font-size="22" text-anchor="middle">
    <line x1="144" y1="334" x2="270" y2="374" class="hotl"/>
    <line x1="260" y1="334" x2="300" y2="374" class="hotl"/>
    <line x1="376" y1="334" x2="336" y2="374" class="hotl"/>
    <line x1="492" y1="334" x2="366" y2="374" class="hotl"/>
    <rect x="96"  y="282" width="96" height="52" class="core"/><text x="144" y="316" class="ink">c0</text>
    <rect x="212" y="282" width="96" height="52" class="core"/><text x="260" y="316" class="ink">c1</text>
    <rect x="328" y="282" width="96" height="52" class="core"/><text x="376" y="316" class="ink">c2</text>
    <rect x="444" y="282" width="96" height="52" class="core"/><text x="492" y="316" class="ink">c3</text>
    <rect x="218" y="374" width="200" height="52" class="hot"/><text x="318" y="408" class="ink">1 shared line</text>
  </g>
  <text x="96" y="464" font-size="24" class="ink">shared atomic: <tspan class="red" font-weight="700">88 M ops/s</tspan></text>

  <!-- right: each core writes its own cache line -->
  <g font-size="22" text-anchor="middle">
    <line x1="708"  y1="334" x2="708"  y2="374" class="ownl"/>
    <line x1="824"  y1="334" x2="824"  y2="374" class="ownl"/>
    <line x1="940"  y1="334" x2="940"  y2="374" class="ownl"/>
    <line x1="1056" y1="334" x2="1056" y2="374" class="ownl"/>
    <rect x="660"  y="282" width="96" height="52" class="core"/><text x="708"  y="316" class="ink">c0</text>
    <rect x="776"  y="282" width="96" height="52" class="core"/><text x="824"  y="316" class="ink">c1</text>
    <rect x="892"  y="282" width="96" height="52" class="core"/><text x="940"  y="316" class="ink">c2</text>
    <rect x="1008" y="282" width="96" height="52" class="core"/><text x="1056" y="316" class="ink">c3</text>
    <rect x="660"  y="374" width="96" height="52" class="own"/><text x="708"  y="408" class="ink">line</text>
    <rect x="776"  y="374" width="96" height="52" class="own"/><text x="824"  y="408" class="ink">line</text>
    <rect x="892"  y="374" width="96" height="52" class="own"/><text x="940"  y="408" class="ink">line</text>
    <rect x="1008" y="374" width="96" height="52" class="own"/><text x="1056" y="408" class="ink">line</text>
  </g>
  <text x="660" y="464" font-size="24" class="ink">sharded: <tspan class="green" font-weight="700">2 832 M ops/s</tspan></text>

  <text x="96" y="522" font-size="24" class="ink">Same 4 cores, same work. One cache line per core is 32× faster.</text>
</svg>
