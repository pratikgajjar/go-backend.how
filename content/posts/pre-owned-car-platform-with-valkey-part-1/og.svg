<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .proc { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .data { fill: var(--brown-l); stroke: var(--brown); stroke-width: 2.5; stroke-dasharray: 8 5; }
    .arr { stroke: var(--ink); stroke-width: 2.5; fill: none; }
    .head { fill: var(--ink); }
    .bin { stroke: var(--orange); stroke-width: 4; fill: none; }
    .org { fill: var(--orange); }
    .brn { fill: var(--brown); }
    text { font-family: var(--font-mono); }
  </style>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1104" height="526" class="ink"/>
  <rect x="48" y="48" width="1104" height="526" class="box"/>

  <text x="96" y="112" font-size="28" class="mute">backend.how</text>
  <text x="96" y="182" font-size="58" font-weight="800" class="ink">Pre-owned car platform</text>
  <text x="96" y="234" font-size="34" font-weight="600" class="ink">with Valkey - Part 1</text>

  <g font-size="28" text-anchor="middle">
    <!-- three apps write to MySQL directly -->
    <rect x="96" y="284" width="150" height="50" class="proc"/><text x="171" y="319" class="ink">CakePHP</text>
    <rect x="96" y="344" width="150" height="50" class="proc"/><text x="171" y="379" class="ink">Django</text>
    <rect x="96" y="404" width="150" height="50" class="proc"/><text x="171" y="439" class="ink">scripts</text>
    <path d="M246 309 L280 350" class="arr"/><path d="M290 361 l-15.5 -4 l9 -8 z" class="head"/>
    <path d="M246 369 L278 369" class="arr"/><path d="M290 369 l-14 -8 v16 z" class="head"/>
    <path d="M246 429 L280 388" class="arr"/><path d="M290 377 l-6.5 14 l-9 -8 z" class="head"/>

    <rect x="292" y="329" width="120" height="80" class="proc"/><text x="352" y="379" class="ink">MySQL</text>

    <!-- the choice: read the binlog -->
    <line x1="412" y1="369" x2="520" y2="369" class="bin"/>
    <path d="M536 369 l-18 -10 v20 z" class="org"/>
    <text x="472" y="350" class="org" font-weight="700">binlog</text>

    <rect x="538" y="329" width="116" height="80" class="proc"/><text x="596" y="379" class="ink">Kafka</text>
    <line x1="654" y1="369" x2="682" y2="369" class="arr"/><path d="M694 369 l-14 -8 v16 z" class="head"/>

    <!-- one pre-computed JSON per car, in Valkey -->
    <text x="796" y="302" class="mute">Valkey</text>
    <rect x="696" y="314" width="200" height="110" class="data"/>
    <text x="796" y="362" class="ink" font-weight="700">dp:2323</text>
    <text x="796" y="400" class="brn">car JSON</text>

    <!-- buyer reads one key -->
    <line x1="896" y1="369" x2="924" y2="369" class="arr"/><path d="M936 369 l-14 -8 v16 z" class="head"/>
  </g>
  <g font-size="28" class="ink">
    <text x="948" y="360">car page</text>
    <text x="948" y="398" font-weight="700">60 ms</text>
  </g>
  <text x="96" y="520" font-size="28" class="ink">Every write from every app goes through the binlog.</text>
</svg>
