<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#2b2519">
  <rect width="560" height="210" fill="#f1ead3"/>
  <g text-anchor="middle">
    <text x="92" y="128" font-size="96">Q</text>
    <text x="176" y="112" font-size="40">=</text>
    <text x="256" y="128" font-size="72">K</text>
    <text x="330" y="112" font-size="40">×</text>
