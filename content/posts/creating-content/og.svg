<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .grow { fill: var(--green-l); stroke: var(--green); stroke-width: 2.5; }
    .given { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .look { fill: var(--purple); } .lookl { stroke: var(--purple); stroke-width: 4; fill: none; }
    text { font-family: var(--font-mono); }
  </style>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1104" height="526" class="ink"/>
  <rect x="48" y="48" width="1104" height="526" class="box"/>

  <text x="96" y="110" font-size="28" class="mute">backend.how</text>
  <text x="96" y="180" font-size="58" font-weight="800" class="ink">Creating Content</text>
  <text x="96" y="234" font-size="34" font-weight="600" class="ink">Talent is the small term</text>

  <!-- quality = knowledge + practice + talent -->
  <text x="96" y="298" font-size="30" class="mute">quality =</text>
  <rect x="96"  y="318" width="420" height="112" class="grow"/>
  <text x="122" y="364" font-size="32" font-weight="800" class="ink">K knowledge</text>
  <text x="122" y="408" font-size="28" class="ink">you grow it</text>
  <text x="542" y="386" font-size="36" font-weight="600" text-anchor="middle" class="mute">+</text>
  <rect x="568" y="318" width="420" height="112" class="grow"/>
  <text x="594" y="364" font-size="32" font-weight="800" class="ink">P practice</text>
  <text x="594" y="408" font-size="28" class="ink">you grow it</text>
  <text x="1014" y="386" font-size="36" font-weight="600" text-anchor="middle" class="mute">+</text>
  <rect x="1040" y="318" width="56" height="112" class="given"/>
  <text x="1068" y="386" font-size="32" font-weight="800" text-anchor="middle" class="ink">T</text>

  <!-- pointer to the small T -->
  <path d="M1068 508 V462" class="lookl"/>
  <path d="M1068 446 l-12 18 h24 z" class="look"/>
  <text x="1040" y="508" font-size="30" text-anchor="end" class="ink">talent is given, and “the T is very small”</text>
</svg>
