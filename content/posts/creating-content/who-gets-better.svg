<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#0a0d12">
<rect width="560" height="250" fill="#fbfaf7"/>
<text x="170" y="32" font-size="14" font-weight="800">Retton</text><text x="170" y="49" font-size="10">Olympic gymnast</text>
<text x="360" y="32" font-size="14" font-weight="800">Winston</text><text x="360" y="49" font-size="10">MIT professor</text>
<line x1="14" y1="62" x2="546" y2="62" stroke="#0a0d12" stroke-width="1.5"/>
<text x="18" y="84" font-size="15" font-weight="800">T</text><text x="38" y="83" font-size="12">talent</text><text x="38" y="98" font-size="10">given</text>
<line x1="14" y1="110" x2="546" y2="110" stroke="#babec4"/>
<line x1="170" y1="93" x2="320" y2="93" stroke="#babec4" stroke-width="1.5"/>
<rect x="170" y="80" width="150.0" height="12" fill="#0a0d12"/>
<line x1="360" y1="93" x2="510" y2="93" stroke="#babec4" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="360" y="89" font-size="11">not said</text>
<text x="18" y="132" font-size="15" font-weight="800">K</text><text x="38" y="131" font-size="12">knowledge</text><text x="38" y="146" font-size="10">you grow it</text>
<line x1="14" y1="158" x2="546" y2="158" stroke="#babec4"/>
<line x1="170" y1="141" x2="320" y2="141" stroke="#babec4" stroke-width="1.5"/>
<rect x="170" y="128" width="37.5" height="12" fill="#006732"/>
<line x1="360" y1="141" x2="510" y2="141" stroke="#babec4" stroke-width="1.5"/>
<rect x="360" y="128" width="112.5" height="12" fill="#006732"/>
<text x="18" y="180" font-size="15" font-weight="800">P</text><text x="38" y="179" font-size="12">practice</text><text x="38" y="194" font-size="10">you grow it</text>
<line x1="14" y1="206" x2="546" y2="206" stroke="#babec4"/>
<line x1="170" y1="189" x2="320" y2="189" stroke="#babec4" stroke-width="1.5"/>
<rect x="170" y="176" width="37.5" height="12" fill="#006732"/>
<line x1="360" y1="189" x2="510" y2="189" stroke="#babec4" stroke-width="1.5"/>
<rect x="360" y="176" width="112.5" height="12" fill="#006732"/>
<text x="280.0" y="214" text-anchor="middle" font-size="12" font-style="italic">“I was a better skier because I had the K,</text>
<text x="280.0" y="231" text-anchor="middle" font-size="12" font-style="italic">and I had the P, and all she had was the T.” — Winston</text></svg>
