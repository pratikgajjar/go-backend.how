<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .op { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .txn { fill: var(--board); stroke: var(--green); stroke-width: 3; }
    .data { fill: var(--brown-l); stroke: var(--brown); stroke-width: 2; stroke-dasharray: 7 5; }
    .arr { stroke: var(--ink); stroke-width: 3; } .head { fill: var(--ink); }
    .commit { stroke: var(--green); stroke-width: 6; } .gtext { fill: var(--green); }
    text { font-family: var(--font-mono); }
  </style>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1096" height="526" class="ink"/>
  <rect x="48" y="48" width="1096" height="526" class="box"/>

  <text x="96" y="116" font-size="28" class="mute">backend.how</text>
  <text x="96" y="186" font-size="58" font-weight="800" class="ink">fdyno</text>
  <text x="96" y="244" font-size="34" font-weight="600" class="ink">DynamoDB on FoundationDB</text>

  <!-- one PutItem becomes one FDB transaction -->
  <rect x="96" y="348" width="164" height="104" class="op"/>
  <text x="178" y="410" font-size="28" text-anchor="middle" class="ink">PutItem</text>
  <line x1="260" y1="400" x2="284" y2="400" class="arr"/>
  <path d="M296 400 l-14 -10 v20 z" class="head"/>

  <!-- the transaction holds item, both indexes and the CDC record -->
  <rect x="300" y="284" width="796" height="196" class="txn"/>
  <text x="320" y="324" font-size="28" font-weight="700" class="gtext">one FDB transaction</text>
  <g font-size="30" text-anchor="middle">
    <rect x="320" y="348" width="132" height="104" class="data"/><text x="386" y="411" class="ink">item</text>
    <rect x="466" y="348" width="132" height="104" class="data"/><text x="532" y="411" class="ink">GSI-1</text>
    <rect x="612" y="348" width="132" height="104" class="data"/><text x="678" y="411" class="ink">GSI-2</text>
    <rect x="758" y="348" width="132" height="104" class="data"/><text x="824" y="411" class="ink">CDC</text>
  </g>
  <!-- single commit point -->
  <line x1="918" y1="300" x2="918" y2="464" class="commit"/>
  <text x="936" y="411" font-size="30" font-weight="700" class="gtext">commit</text>

  <text x="96" y="530" font-size="28" class="ink">All four are written together, or none are</text>
</svg>
