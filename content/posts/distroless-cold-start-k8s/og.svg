<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .bytes { fill: var(--brown-l); stroke: var(--brown); stroke-width: 2.5; stroke-dasharray: 8 5; }
    .brown { fill: var(--brown); }
    .start { fill: var(--purple-l); stroke: var(--purple); stroke-width: 2.5; }
    .spread { stroke: var(--purple); stroke-width: 4; }
    text { font-family: var(--font-mono); }
  </style>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1096" height="526" class="ink"/>
  <rect x="48" y="48" width="1096" height="526" class="box"/>

  <text x="96" y="108" font-size="24" class="mute">backend.how</text>
  <text x="96" y="176" font-size="54" font-weight="800" class="ink">Distroless vs Wolfi vs Scratch</text>
  <text x="96" y="226" font-size="32" font-weight="600" class="ink">Cold-Start Latency for a 10MB Go Binary on K8s</text>

  <!-- column headers -->
  <g font-size="22" class="mute">
    <text x="270" y="286">bytes on the wire</text>
    <text x="750" y="286">start to first 200 OK</text>
  </g>

  <!-- left: image bytes (data, dashed), 44 px per MB -->
  <g font-size="24" font-weight="700" class="ink">
    <text x="96" y="333">scratch</text>
    <text x="96" y="391">distroless</text>
    <text x="96" y="449">wolfi</text>
  </g>
  <rect x="270" y="304" width="175" height="42" class="bytes"/>
  <rect x="270" y="362" width="213" height="42" class="bytes"/>
  <rect x="270" y="420" width="441" height="42" class="bytes"/>
  <g font-size="22" class="brown">
    <text x="284" y="332">3.98 MB</text>
    <text x="284" y="390">4.83 MB</text>
    <text x="284" y="448">10.03 MB</text>
  </g>

  <!-- right: start time, 1 px per ms; box to fastest run, whisker to slowest -->
  <rect x="750" y="304" width="219" height="42" class="start"/><line x1="969" y1="325" x2="1035" y2="325" class="spread"/><line x1="1035" y1="311" x2="1035" y2="339" class="spread"/>
  <rect x="750" y="362" width="232" height="42" class="start"/><line x1="982" y1="383" x2="1075" y2="383" class="spread"/><line x1="1075" y1="369" x2="1075" y2="397" class="spread"/>
  <rect x="750" y="420" width="219" height="42" class="start"/><line x1="969" y1="441" x2="1009" y2="441" class="spread"/><line x1="1009" y1="427" x2="1009" y2="455" class="spread"/>
  <g font-size="22" class="ink">
    <text x="764" y="332">219–285 ms</text>
    <text x="764" y="390">232–325 ms</text>
    <text x="764" y="448">219–259 ms</text>
  </g>

  <text x="96" y="520" font-size="26" class="ink">2.5× the bytes, same start time. Runtime setup is ~200 ms.</text>
</svg>
