<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
  <title>One price change: MySQL, binlog, producer, Kafka, consumer, Valkey, API</title>
  <defs>
    <marker id="b-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16181d"/></marker>
    <marker id="b-mute" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a8e96"/></marker>
  </defs>
  <rect width="960" height="300" fill="#fbfaf6"/>

  <g fill="none" stroke="#16181d" stroke-width="1.7">
    <path d="M140,54 L180,54" marker-end="url(#b-ink)"/>
    <path d="M340,118 L380,118" marker-end="url(#b-ink)"/>
    <path d="M510,118 L530,118 L530,54 L550,54" marker-end="url(#b-ink)"/>
    <path d="M720,54 L770,54" marker-end="url(#b-ink)"/>
    <path d="M860,86 L860,150" marker-end="url(#b-ink)"/>
    <path d="M170,202 L320,202" marker-end="url(#b-ink)"/>
    <path d="M540,202 L770,202" marker-end="url(#b-ink)"/>
  </g>
  <path d="M800,22 L800,8 L300,8 L300,22" fill="none" stroke="#8a8e96" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#b-mute)"/>
  <text x="550" y="12" font-size="10" text-anchor="middle" fill="#555961" stroke="#fbfaf6" stroke-width="3.5" paint-order="stroke">reads the car rows</text>
  <text x="655" y="196" font-size="10" text-anchor="middle" fill="#555961">GET</text>

  <g fill="#fbfaf6" stroke="#16181d" stroke-width="1.4">
    <rect x="10" y="22" width="130" height="64"/>
    <rect x="180" y="22" width="160" height="128"/>
    <rect x="380" y="86" width="130" height="64"/>
    <rect x="550" y="22" width="170" height="128"/>
    <rect x="770" y="22" width="180" height="64"/>
    <rect x="770" y="150" width="180" height="104" fill="#f9dcd8" stroke="#b42a24" stroke-width="2"/>
    <rect x="320" y="174" width="220" height="56"/>
    <rect x="10" y="174" width="160" height="56"/>
  </g>
  <g stroke="#c3c5c9"><line x1="180" x2="340" y1="86" y2="86"/><line x1="550" x2="720" y1="86" y2="86"/><line x1="770" x2="950" y1="202" y2="202"/></g>

  <g text-anchor="middle" fill="#16181d">
    <text x="75" y="52" font-size="13" font-weight="800">price script</text><text x="75" y="66" font-size="10" fill="#555961">UPDATE price</text>
    <text x="260" y="52" font-size="13" font-weight="800">MySQL</text><text x="260" y="66" font-size="10" fill="#555961">~10 tables</text>
    <text x="260" y="114" font-size="13" font-weight="800">binlog</text><text x="260" y="130" font-weight="800" fill="#6f4a1f">000412 : 18807</text>
    <text x="445" y="116" font-size="13" font-weight="800">producer</text><text x="445" y="130" font-size="10" fill="#555961">binlog → Kafka</text>
    <text x="635" y="52" font-size="13" font-weight="800">Kafka</text><text x="635" y="66" font-size="10" fill="#555961">topic cars</text>
    <text x="635" y="114" font-size="13" font-weight="800">consumer offset</text><text x="635" y="130" font-weight="800" fill="#6f4a1f">p2 → 88,121</text>
    <text x="860" y="52" font-size="13" font-weight="800">consumer</text><text x="860" y="66" font-size="10" fill="#555961">rebuild JSON</text>
    <text x="860" y="174" font-size="13" font-weight="800">Valkey</text><text x="860" y="188" font-size="10" fill="#555961">:1:dp:2323</text>
    <text x="860" y="226" font-size="13" font-weight="800">price in JSON</text><text x="860" y="242" font-weight="800" fill="#b42a24">525,000 · stale until SET</text>
    <text x="430" y="200" font-size="13" font-weight="800">Django API</text><text x="430" y="214" font-size="10" fill="#555961">GET /listing/2323/</text>
    <text x="90" y="200" font-size="13" font-weight="800">buyer</text><text x="90" y="214" font-size="10" fill="#555961">from an ad</text>
    <text x="260" y="164" font-size="10" font-weight="800" fill="#1e6a3c">DURABLE</text>
    <text x="635" y="164" font-size="10" font-weight="800" fill="#1e6a3c">DURABLE</text>
  </g>

  <!-- failure markers, numbered as in the text -->
  <g font-size="10" font-weight="800" text-anchor="middle" fill="#fbfaf6">
    <circle cx="938" cy="22" r="9" fill="#b42a24" stroke="#fbfaf6" stroke-width="2"/><text x="938" y="25.5">1</text>
    <circle cx="498" cy="86" r="9" fill="#b42a24" stroke="#fbfaf6" stroke-width="2"/><text x="498" y="89.5">2</text>
    <circle cx="938" cy="150" r="9" fill="#b42a24" stroke="#fbfaf6" stroke-width="2"/><text x="938" y="153.5">3</text>
    <circle cx="708" cy="22" r="9" fill="#b42a24" stroke="#fbfaf6" stroke-width="2"/><text x="708" y="25.5">4</text>
    <circle cx="328" cy="22" r="9" fill="#b42a24" stroke="#fbfaf6" stroke-width="2"/><text x="328" y="25.5">5</text>
  </g>
  <text x="10" y="284" font-size="11" fill="#16181d">Sample values. Red numbers: 1 consumer · 2 producer · 3 Valkey · 4 Kafka · 5 MySQL, as in the text.</text>
</svg>
