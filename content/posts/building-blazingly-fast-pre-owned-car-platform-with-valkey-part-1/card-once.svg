<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
  <title>One car card, built once and read by every ad click</title>
  <defs>
    <marker id="h-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="f-ink" d="M0,0 L8,4 L0,8 z" fill="#211a14"/></marker>
    <marker id="h-grn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="f-safe" d="M0,0 L8,4 L0,8 z" fill="#1e6a3c"/></marker>
    <symbol id="h-car" viewBox="0 0 170 80">
      <path class="f-paper s-ink" d="M12,62 L14,50 Q16,44 26,42 L44,40 L62,24 Q68,20 80,20 L112,20 Q122,20 128,26 L144,40 Q158,42 162,50 L164,62 Z" fill="#fafaf7" stroke="#211a14" stroke-width="2.4" stroke-linejoin="round"/>
      <path class="f-tint s-ink" d="M68,27 L80,24 L100,24 L100,40 L54,40 Z M106,24 L114,24 Q120,24 124,29 L134,40 L106,40 Z" fill="#efe6d8" stroke="#211a14" stroke-width="1.6" stroke-linejoin="round"/>
      <circle class="f-ink" cx="44" cy="62" r="12" fill="#211a14"/><circle class="f-paper" cx="44" cy="62" r="4.5" fill="#fafaf7"/>
      <circle class="f-ink" cx="134" cy="62" r="12" fill="#211a14"/><circle class="f-paper" cx="134" cy="62" r="4.5" fill="#fafaf7"/>
    </symbol>
    <symbol id="h-phone" viewBox="0 0 36 56">
      <rect class="f-paper s-ink" x="1" y="1" width="34" height="54" rx="6" fill="#fafaf7" stroke="#211a14" stroke-width="1.6"/>
      <rect class="f-tint" x="6" y="8" width="24" height="16" rx="2" fill="#efe6d8"/>
      <rect class="f-data" x="6" y="30" width="16" height="4" fill="#6f4a1f"/>
      <rect class="f-line" x="6" y="38" width="24" height="3" fill="#d8cfc2"/>
      <rect class="f-line" x="6" y="44" width="18" height="3" fill="#d8cfc2"/>
    </symbol>
  </defs>
  <rect class="f-paper" width="960" height="440" fill="#fafaf7"/>

  <text class="f-ink" x="24" y="38" font-size="16" font-weight="800" fill="#211a14">Build the car card once. Serve every ad click from one key.</text>

  <!-- MySQL: data at rest -->
  <text class="f-ink" x="24" y="88" font-size="14" font-weight="800" fill="#211a14">MySQL</text>
  <text class="f-mute" x="82" y="88" font-size="11" fill="#5c534a">~10 tables per car</text>
  <g font-size="12" fill="#6f4a1f">
    <rect class="f-datal s-data" x="24" y="100" width="210" height="32" rx="3" fill="#f3e4cc" stroke="#6f4a1f" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text class="f-data" x="38" y="121" fill="#6f4a1f">cars</text>
    <rect class="f-datal s-data" x="24" y="140" width="210" height="32" rx="3" fill="#f3e4cc" stroke="#6f4a1f" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text class="f-data" x="38" y="161" fill="#6f4a1f">car_images</text>
    <rect class="f-datal s-data" x="24" y="180" width="210" height="32" rx="3" fill="#f3e4cc" stroke="#6f4a1f" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text class="f-data" x="38" y="201" fill="#6f4a1f">car_features</text>
    <rect class="f-datal s-data" x="24" y="220" width="210" height="32" rx="3" fill="#f3e4cc" stroke="#6f4a1f" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text class="f-data" x="38" y="241" fill="#6f4a1f">… 7 more</text>
  </g>
  <path class="s-ink" d="M234,176 L316,176" stroke="#211a14" stroke-width="1.8" fill="none" marker-end="url(#h-ink)"/>
  <text class="f-ink" x="275" y="166" font-size="11" text-anchor="middle" fill="#211a14">build</text>
  <text class="f-ink" x="275" y="194" font-size="11" text-anchor="middle" fill="#211a14">JSON</text>

  <!-- Valkey and the card -->
  <rect class="f-paper s-ink" x="318" y="70" width="300" height="262" rx="6" fill="#fafaf7" stroke="#211a14" stroke-width="1.6"/>
  <text class="f-ink" x="334" y="94" font-size="14" font-weight="800" fill="#211a14">Valkey</text>
  <text class="f-data" x="602" y="94" font-weight="800" text-anchor="end" fill="#6f4a1f">dp:2323</text>
  <rect class="f-pickl s-pick" x="336" y="106" width="264" height="210" rx="10" fill="#fde0c2" stroke="#b8520f" stroke-width="2.2"/>
  <rect class="f-paper" x="348" y="118" width="240" height="96" rx="6" fill="#fafaf7"/>
  <use href="#h-car" x="383" y="126" width="170" height="80"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text class="f-ink" x="350" y="240" font-size="15" font-weight="700" fill="#211a14">Tata Nexon XZ+</text>
    <text class="f-mute" x="350" y="258" font-size="12" fill="#5c534a">2nd owner · Mumbai · sample</text>
    <text class="f-data" x="350" y="296" font-size="22" font-weight="800" fill="#6f4a1f">₹5,10,000</text>
  </g>
  <text class="f-mute" x="588" y="296" font-size="10" text-anchor="end" fill="#5c534a">gzip JSON</text>
  <text class="f-mute" x="588" y="308" font-size="10" text-anchor="end" fill="#5c534a">TTL 12 h</text>

  <!-- ad clicks -->
  <g class="s-ink" stroke="#211a14" stroke-width="1.6" fill="none">
    <path d="M840,112 L700,112 L620,170" marker-end="url(#h-ink)"/>
    <path d="M840,196 L620,196" marker-end="url(#h-ink)"/>
    <path d="M840,280 L700,280 L620,222" marker-end="url(#h-ink)"/>
  </g>
  <use href="#h-phone" x="844" y="84" width="36" height="56"/>
  <use href="#h-phone" x="844" y="168" width="36" height="56"/>
  <use href="#h-phone" x="844" y="252" width="36" height="56"/>
  <g class="f-ink" font-size="11" fill="#211a14">
    <text x="888" y="116">Google</text><text x="888" y="200">Facebook</text><text x="888" y="284">Instagram</text>
  </g>
  <text class="f-ink" x="760" y="104" font-size="11" text-anchor="middle" fill="#211a14">GET dp:2323</text>
  <text class="f-ink" x="738" y="188" font-size="11" text-anchor="middle" fill="#211a14">one key lookup</text>
  <text class="f-mute" x="844" y="332" font-size="11" fill="#5c534a">95%+ of traffic</text>
  <rect class="s-ink" x="664" y="306" width="116" height="26" rx="13" fill="none" stroke="#211a14" stroke-width="1.4"/>
  <text class="f-ink" x="722" y="323" font-size="11" font-weight="800" text-anchor="middle" fill="#211a14">target 60 ms</text>

  <!-- rebuild loop -->
  <path class="s-safe" d="M214,252 L214,390 L590,390 L590,334" stroke="#1e6a3c" stroke-width="2.2" fill="none" marker-end="url(#h-grn)"/>
  <g font-size="11" font-weight="800" text-anchor="middle">
    <rect class="f-safel s-safe" x="232" y="378" width="64" height="24" rx="12" fill="#d3efdc" stroke="#1e6a3c" stroke-width="1.4"/><text class="f-safe" x="264" y="394" fill="#1e6a3c">binlog</text>
    <rect class="f-safel s-safe" x="306" y="378" width="80" height="24" rx="12" fill="#d3efdc" stroke="#1e6a3c" stroke-width="1.4"/><text class="f-safe" x="346" y="394" fill="#1e6a3c">producer</text>
    <rect class="f-safel s-safe" x="396" y="378" width="62" height="24" rx="12" fill="#d3efdc" stroke="#1e6a3c" stroke-width="1.4"/><text class="f-safe" x="427" y="394" fill="#1e6a3c">Kafka</text>
    <rect class="f-safel s-safe" x="468" y="378" width="84" height="24" rx="12" fill="#d3efdc" stroke="#1e6a3c" stroke-width="1.4"/><text class="f-safe" x="510" y="394" fill="#1e6a3c">consumer</text>
  </g>
  <text class="f-safe" x="602" y="366" font-size="12" font-weight="800" fill="#1e6a3c">rebuild when any row changes</text>
  <text class="f-mute" x="24" y="286" font-size="11" fill="#5c534a">written by the ops portal,</text>
  <text class="f-mute" x="24" y="302" font-size="11" fill="#5c534a">the inventory app, and</text>
  <text class="f-mute" x="24" y="318" font-size="11" fill="#5c534a">price scripts</text>
  <text class="f-mute fb-only" x="24" y="428" font-size="10" fill="#5c534a">orange: the pre-computed card (our choice) · brown: data · green: the path that keeps it fresh</text>
</svg>
