<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
  <title>Which writes each cache hook sees</title>
  <defs>
    <marker id="a-ink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16181d"/></marker>
    <marker id="a-grn" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1e6a3c"/></marker>
  </defs>
  <rect width="960" height="340" fill="#fbfaf6"/>

  <!-- writers -->
  <rect x="10" y="12" width="330" height="134" fill="#fbfaf6" stroke="#16181d" stroke-width="1.4"/>
  <text x="22" y="32" font-size="13" font-weight="800" fill="#16181d">Inventory app <tspan font-size="10" font-weight="400" fill="#555961">Django</tspan></text>
  <rect x="22" y="44" width="78" height="92" rx="2" fill="#dde6fa" stroke="#2a4fa6" stroke-width="2"/>
  <text x="61" y="86" font-size="10" font-weight="800" text-anchor="middle" fill="#2a4fa6">CarService</text>
  <text x="61" y="102" font-size="10" text-anchor="middle" fill="#2a4fa6">domain</text>
  <text x="112" y="62" font-size="10" fill="#16181d">save() · create()</text>
  <text x="112" y="108" font-size="10" fill="#16181d">.update() · bulk_create()</text>
  <path d="M100,68 L430,68" stroke="#16181d" stroke-width="1.7" fill="none" marker-end="url(#a-ink)"/>
  <path d="M100,114 L430,114" stroke="#16181d" stroke-width="1.7" fill="none" marker-end="url(#a-ink)"/>
  <rect x="212" y="56" width="104" height="24" rx="2" fill="#dde6fa" stroke="#2a4fa6" stroke-width="2"/>
  <text x="264" y="72" font-weight="800" text-anchor="middle" fill="#2a4fa6">post_save</text>
  <circle cx="405" cy="114" r="9" fill="#b42a24"/><text x="405" y="118" text-anchor="middle" font-weight="800" fill="#fbfaf6">✗</text>
  <text x="330" y="132" font-size="10" text-anchor="end" fill="#b42a24">no post_save</text>

  <rect x="10" y="162" width="330" height="54" fill="#fbfaf6" stroke="#16181d" stroke-width="1.4"/>
  <text x="22" y="194" font-size="13" font-weight="800" fill="#16181d">Ops portal <tspan font-size="10" font-weight="400" fill="#555961">CakePHP</tspan></text>
  <path d="M340,189 L430,189" stroke="#16181d" stroke-width="1.7" fill="none" marker-end="url(#a-ink)"/>
  <circle cx="385" cy="189" r="9" fill="#b42a24"/><text x="385" y="193" text-anchor="middle" font-weight="800" fill="#fbfaf6">✗</text>

  <rect x="10" y="230" width="330" height="54" fill="#fbfaf6" stroke="#16181d" stroke-width="1.4"/>
  <text x="22" y="262" font-size="13" font-weight="800" fill="#16181d">Price scripts <tspan font-size="10" font-weight="400" fill="#555961">Python + SQL</tspan></text>
  <path d="M340,257 L430,257" stroke="#16181d" stroke-width="1.7" fill="none" marker-end="url(#a-ink)"/>
  <circle cx="385" cy="257" r="9" fill="#b42a24"/><text x="385" y="261" text-anchor="middle" font-weight="800" fill="#fbfaf6">✗</text>
  <text x="22" y="304" font-size="10" fill="#b42a24">✗ signals and the domain layer never see these writes</text>

  <!-- MySQL -->
  <rect x="430" y="12" width="210" height="272" fill="#fbfaf6" stroke="#16181d" stroke-width="1.4"/>
  <text x="446" y="32" font-size="13" font-weight="800" fill="#16181d">MySQL <tspan font-size="10" font-weight="400" fill="#555961">primary</tspan></text>
  <rect x="446" y="40" width="178" height="30" fill="#f2e3cf" stroke="#6f4a1f" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="535" y="59" text-anchor="middle" fill="#6f4a1f" font-weight="800">cars</text>
  <rect x="446" y="80" width="178" height="30" fill="#f2e3cf" stroke="#6f4a1f" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="535" y="99" text-anchor="middle" fill="#6f4a1f" font-weight="800">car_images</text>
  <rect x="446" y="120" width="178" height="30" fill="#f2e3cf" stroke="#6f4a1f" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="535" y="139" text-anchor="middle" fill="#6f4a1f" font-weight="800">car_features</text>
  <path d="M535,154 L535,206" stroke="#16181d" stroke-width="1.7" fill="none" marker-end="url(#a-ink)"/>
  <text x="541" y="184" font-size="10" fill="#555961">every commit</text>
  <rect x="446" y="206" width="178" height="60" fill="#fbfaf6" stroke="#16181d" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="458" y="226" font-weight="800" fill="#16181d">binlog</text>
  <text x="458" y="244" font-size="10" font-weight="800" fill="#6f4a1f">row events</text>
  <rect x="560" y="250" width="112" height="26" rx="2" fill="#cdeed8" stroke="#1e6a3c" stroke-width="2.2"/>
  <text x="616" y="267" font-weight="800" text-anchor="middle" fill="#1e6a3c">reader</text>
  <text x="616" y="298" font-size="10" font-weight="800" text-anchor="middle" fill="#c05a14">OUR PICK · SEES ALL 5 WRITES</text>

  <!-- Valkey -->
  <path d="M672,263 L712,263 L712,170 L760,170" stroke="#1e6a3c" stroke-width="1.9" fill="none" marker-end="url(#a-grn)"/>
  <rect x="760" y="96" width="190" height="104" fill="#fbfaf6" stroke="#16181d" stroke-width="1.4"/>
  <text x="855" y="118" font-size="13" font-weight="800" text-anchor="middle" fill="#16181d">Valkey</text>
  <text x="855" y="138" font-weight="800" text-anchor="middle" fill="#6f4a1f">:1:dp:2323</text>
  <text x="855" y="160" font-weight="800" text-anchor="middle" fill="#1e6a3c">rebuilt</text>
  <text x="855" y="178" font-size="10" text-anchor="middle" fill="#1e6a3c">fresh JSON</text>

  <text x="10" y="330" font-size="11" fill="#16181d">Writes seen, out of 5 sample writes:  signals 1 · domain layer 3 · binlog reader 5</text>
</svg>
