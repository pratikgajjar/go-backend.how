<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 290" width="920" height="290" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13">
<title>Two key shapes: the car: hash (id to listing JSON) and the car:price sorted set (id scored by price)</title>
<rect x="10" y="14" width="440" height="262" fill="#fbfaf7" stroke="#0a0d12" stroke-width="1.5"/><text x="26" y="42" font-weight="800" font-size="14" fill="#6c4122">car:</text><text x="62" y="42" font-size="11" fill="#0a0d12">  hash · encoding: hashtable</text><rect x="26" y="54" width="408" height="88" fill="none" stroke="#6c4122" stroke-dasharray="5 4"/><text x="36" y="70" font-size="11.5" font-weight="400" fill="#44484e">field</text><text x="120" y="70" font-size="11.5" font-weight="400" fill="#44484e">value</text><text x="36" y="92" font-size="11.5" font-weight="700" fill="#6c4122">101</text><text x="120" y="92" font-size="11.5" font-weight="700" fill="#6c4122">{"id":101,"price":775000,…}</text><text x="36" y="114" font-size="11.5" font-weight="700" fill="#6c4122">102</text><text x="120" y="114" font-size="11.5" font-weight="700" fill="#6c4122">{"id":102,"price":455000,…}</text><text x="36" y="136" font-size="11.5" font-weight="700" fill="#6c4122">109</text><text x="120" y="136" font-size="11.5" font-weight="700" fill="#6c4122">{"id":109,"price":430000,…}</text><rect x="26" y="152" width="408" height="78" fill="#f1f0ed"/><text x="38" y="169" font-size="11.5" font-weight="700" fill="#0a0d12">&gt; HMGET car: 101 102 999</text><text x="50" y="187" font-size="11.5" fill="#6c4122">1) "{…101…}"</text><text x="50" y="205" font-size="11.5" fill="#6c4122">2) "{…102…}"</text><text x="50" y="223" font-size="11.5" fill="#be1219">3) (nil)</text>
<rect x="470" y="14" width="440" height="262" fill="#fbfaf7" stroke="#0a0d12" stroke-width="1.5"/><text x="486" y="42" font-weight="800" font-size="14" fill="#6c4122">car:price</text><text x="567" y="42" font-size="11" fill="#0a0d12">  sorted set · encoding: listpack → skiplist</text><rect x="486" y="54" width="408" height="110" fill="none" stroke="#6c4122" stroke-dasharray="5 4"/><text x="496" y="70" font-size="11.5" font-weight="400" fill="#44484e">member</text><text x="580" y="70" font-size="11.5" font-weight="400" fill="#44484e">score</text><text x="496" y="92" font-size="11.5" font-weight="700" fill="#6c4122">109</text><text x="580" y="92" font-size="11.5" font-weight="700" fill="#6c4122">430000</text><text x="496" y="114" font-size="11.5" font-weight="700" fill="#6c4122">102</text><text x="580" y="114" font-size="11.5" font-weight="700" fill="#6c4122">455000</text><text x="496" y="136" font-size="11.5" font-weight="700" fill="#6c4122">…</text><text x="580" y="136" font-size="11.5" font-weight="700" fill="#6c4122">…</text><text x="496" y="158" font-size="11.5" font-weight="700" fill="#6c4122">105</text><text x="580" y="158" font-size="11.5" font-weight="700" fill="#6c4122">1150000</text><rect x="486" y="174" width="408" height="60" fill="#f1f0ed"/><text x="498" y="191" font-size="11.5" font-weight="700" fill="#0a0d12">&gt; ZRANGEBYSCORE car:price 400000 500000 WITHSCORES</text><text x="510" y="209" font-size="11.5" fill="#6c4122">1) "109"  2) "430000"</text><text x="510" y="227" font-size="11.5" fill="#6c4122">3) "102"  4) "455000"</text>
</svg>