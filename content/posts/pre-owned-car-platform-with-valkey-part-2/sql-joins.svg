<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" width="780" height="540" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="13">
<title>Filters city_id, price and make: Django joins locality, varient and model; city and make are never joined</title>
<rect width="780" height="540" fill="#fbfaf7" stroke="#0a0d12" stroke-width="1.5"/>
<g transform="translate(0,14)"><path d="M160,137.0 H187.5 V37.0 H215" fill="none" stroke="#7024ab" stroke-width="2.6"/><path d="M365,37.0 H410" fill="none" stroke="#babec4" stroke-width="1.4"/><path d="M160,137.0 H187.5 V119.0 H215" fill="none" stroke="#7024ab" stroke-width="2.6"/><path d="M365,119.0 H410" fill="none" stroke="#7024ab" stroke-width="2.6"/><path d="M560,119.0 H605" fill="none" stroke="#babec4" stroke-width="1.4"/><path d="M160,137.0 H187.5 V201.0 H215" fill="none" stroke="#babec4" stroke-width="1.4"/><path d="M160,137.0 H187.5 V283.0 H215" fill="none" stroke="#babec4" stroke-width="1.4"/><path d="M365,283.0 H410" fill="none" stroke="#babec4" stroke-width="1.4"/><g><rect x="10" y="110" width="150" height="54" fill="#ecdaff" stroke="#7024ab" stroke-width="2" stroke-dasharray="5 4"/><text x="20" y="130" font-weight="800" fill="#0a0d12">car</text><rect x="16" y="138" width="138" height="18" fill="#f6e3ce" stroke="#6c4122"/><text x="20" y="151" font-size="11.5" font-weight="800" fill="#6c4122">price</text></g><g><rect x="215" y="10" width="150" height="54" fill="#ecdaff" stroke="#7024ab" stroke-width="2" stroke-dasharray="5 4"/><text x="225" y="30" font-weight="800" fill="#0a0d12">locality</text><rect x="221" y="38" width="138" height="18" fill="#f6e3ce" stroke="#6c4122"/><text x="225" y="51" font-size="11.5" font-weight="800" fill="#6c4122">city_id</text></g><g opacity="0.6"><rect x="410" y="10" width="150" height="54" fill="#fbfaf7" stroke="#babec4" stroke-width="1.3" stroke-dasharray="5 4"/><text x="420" y="30" font-weight="800" fill="#0a0d12">city</text><text x="420" y="51" font-size="11.5" fill="#44484e">not joined</text></g><g><rect x="215" y="92" width="150" height="54" fill="#ecdaff" stroke="#7024ab" stroke-width="2" stroke-dasharray="5 4"/><text x="225" y="112" font-weight="800" fill="#0a0d12">varient</text><text x="225" y="133" font-size="11.5" fill="#44484e">model_id</text></g><g><rect x="410" y="92" width="150" height="54" fill="#ecdaff" stroke="#7024ab" stroke-width="2" stroke-dasharray="5 4"/><text x="420" y="112" font-weight="800" fill="#0a0d12">model</text><rect x="416" y="120" width="138" height="18" fill="#f6e3ce" stroke="#6c4122"/><text x="420" y="133" font-size="11.5" font-weight="800" fill="#6c4122">make_id</text></g><g opacity="0.6"><rect x="605" y="92" width="150" height="54" fill="#fbfaf7" stroke="#babec4" stroke-width="1.3" stroke-dasharray="5 4"/><text x="615" y="112" font-weight="800" fill="#0a0d12">make</text><text x="615" y="133" font-size="11.5" fill="#44484e">not joined</text></g><g><rect x="215" y="174" width="150" height="54" fill="#fbfaf7" stroke="#babec4" stroke-width="1.3" stroke-dasharray="5 4"/><text x="225" y="194" font-weight="800" fill="#0a0d12">color</text><text x="225" y="215" font-size="11.5" fill="#44484e">id, name</text></g><g><rect x="215" y="256" width="150" height="54" fill="#fbfaf7" stroke="#babec4" stroke-width="1.3" stroke-dasharray="5 4"/><text x="225" y="276" font-weight="800" fill="#0a0d12">car_features</text><text x="225" y="297" font-size="11.5" fill="#44484e">car_id, feature_id</text></g><g><rect x="410" y="256" width="150" height="54" fill="#fbfaf7" stroke="#babec4" stroke-width="1.3" stroke-dasharray="5 4"/><text x="420" y="276" font-weight="800" fill="#0a0d12">features</text><text x="420" y="297" font-size="11.5" fill="#44484e">id, name</text></g></g>
<rect x="12" y="352" width="756" height="170" fill="#f1f0ed" stroke="#babec4"/>
<text x="24" y="372" font-size="11.5" fill="#0a0d12">SELECT car.id, car.price, car.varient_id,</text><text x="24" y="389" font-size="11.5" fill="#0a0d12">       car.color_id, car.locality_id FROM car</text><text x="24" y="406" font-size="11.5" fill="#0a0d12">INNER JOIN locality ON (car.locality_id = locality.id)</text><text x="24" y="423" font-size="11.5" fill="#0a0d12">INNER JOIN varient ON (car.varient_id = varient.id)</text><text x="24" y="440" font-size="11.5" fill="#0a0d12">INNER JOIN model ON (varient.model_id = model.id)</text><text x="24" y="457" font-size="11.5" fill="#0a0d12">WHERE (locality.city_id IN (1)</text><text x="24" y="474" font-size="11.5" fill="#0a0d12">   AND car.price &gt;= 200000 AND car.price &lt;= 400000</text><text x="24" y="491" font-size="11.5" fill="#0a0d12">   AND model.make_id IN (120, 121))</text><text x="24" y="508" font-size="11.5" fill="#0a0d12">ORDER BY car.price ASC LIMIT 10 OFFSET 10</text>
<text x="24" y="352" dy="-4" font-size="10.5" fill="#44484e">filters: city_id=1, price 2–4 L, make=120,121 · 3 joins, 4 tables</text>
</svg>