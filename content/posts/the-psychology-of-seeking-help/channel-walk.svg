<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
  <rect width="640" height="360" fill="#fbfbf8"/>
  <text x="20" y="28" font-size="14" font-weight="800" fill="#1a1d24">One question, three channels, one month later</text>
  <text x="20" y="48" font-size="11" fill="#555a66">A asks. B and C know the fix. E joins next month and hits the same error.</text>

  <!-- column: call -->
  <rect x="20" y="66" width="190" height="220" fill="#fbfbf8" stroke="#2f5fb3" stroke-width="1.5"/>
  <text x="32" y="88" font-size="13" font-weight="800" fill="#2f5fb3">Phone call</text>
  <rect x="32" y="100" width="166" height="44" fill="#f8e1dd" stroke="#b8322a" stroke-dasharray="4 3"/>
  <text x="40" y="118" font-size="11" font-weight="700" fill="#b8322a">record: none</text>
  <text x="40" y="134" font-size="10" fill="#1a1d24">spoken, not saved</text>
  <text x="32" y="170" font-size="11" fill="#1a1d24">B stopped work</text>
  <text x="198" y="170" font-size="12" font-weight="800" fill="#b8322a" text-anchor="end">2×</text>
  <text x="32" y="192" font-size="11" fill="#1a1d24">fix given</text>
  <text x="198" y="192" font-size="12" font-weight="800" fill="#b8322a" text-anchor="end">2</text>
  <text x="32" y="214" font-size="11" fill="#1a1d24">searchable</text>
  <text x="198" y="214" font-size="12" font-weight="800" fill="#b8322a" text-anchor="end">nobody</text>
  <text x="32" y="250" font-size="10" fill="#b8322a">E calls B again</text>

  <!-- column: dm -->
  <rect x="225" y="66" width="190" height="220" fill="#fbfbf8" stroke="#2f5fb3" stroke-width="1.5"/>
  <text x="237" y="88" font-size="13" font-weight="800" fill="#2f5fb3">Direct message</text>
  <rect x="237" y="100" width="166" height="44" fill="#f3e6d6" stroke="#7a5530" stroke-dasharray="4 3"/>
  <text x="245" y="118" font-size="11" font-weight="700" fill="#7a5530">record: private</text>
  <text x="245" y="134" font-size="10" fill="#1a1d24">DM between A and B</text>
  <text x="237" y="170" font-size="11" fill="#1a1d24">B stopped work</text>
  <text x="403" y="170" font-size="12" font-weight="800" fill="#1f7a45" text-anchor="end">0×</text>
  <text x="237" y="192" font-size="11" fill="#1a1d24">fix given</text>
  <text x="403" y="192" font-size="12" font-weight="800" fill="#b8322a" text-anchor="end">2</text>
  <text x="237" y="214" font-size="11" fill="#1a1d24">searchable</text>
  <text x="403" y="214" font-size="12" font-weight="800" fill="#1a1d24" text-anchor="end">A, B</text>
  <text x="237" y="250" font-size="10" fill="#b8322a">E DMs B again</text>

  <!-- column: public -->
  <rect x="430" y="66" width="190" height="220" fill="#fbe3c8" stroke="#c2571a" stroke-width="2.5"/>
  <text x="442" y="88" font-size="13" font-weight="800" fill="#c2571a">Public channel</text>
  <rect x="442" y="100" width="166" height="44" fill="#d9f0e0" stroke="#1f7a45" stroke-dasharray="4 3"/>
  <text x="450" y="118" font-size="11" font-weight="700" fill="#1f7a45">record: public</text>
  <text x="450" y="134" font-size="10" fill="#1a1d24">thread in #backend</text>
  <text x="442" y="170" font-size="11" fill="#1a1d24">B stopped work</text>
  <text x="608" y="170" font-size="12" font-weight="800" fill="#1f7a45" text-anchor="end">0×</text>
  <text x="442" y="192" font-size="11" fill="#1a1d24">fix given</text>
  <text x="608" y="192" font-size="12" font-weight="800" fill="#1f7a45" text-anchor="end">1</text>
  <text x="442" y="214" font-size="11" fill="#1a1d24">searchable</text>
  <text x="608" y="214" font-size="12" font-weight="800" fill="#1f7a45" text-anchor="end">all members</text>
  <text x="442" y="250" font-size="10" fill="#1f7a45">E searches, finds the thread</text>
  <text x="442" y="274" font-size="9.5" font-weight="800" fill="#c2571a">RECOMMENDED</text>

  <text x="20" y="316" font-size="10" fill="#555a66">Sample people and question. Slack shows public channel messages in search to</text>
  <text x="20" y="332" font-size="10" fill="#555a66">every workspace member (not guests); the free plan searches the last 90 days.</text>
</svg>
