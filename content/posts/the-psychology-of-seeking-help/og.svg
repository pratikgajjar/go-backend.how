<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .msg { fill: var(--board); stroke: var(--ink); stroke-width: 2; stroke-dasharray: 7 5; }
    .clue { stroke: var(--purple); stroke-width: 3.5; }
    .arr { stroke: var(--ink); stroke-width: 2.5; fill: none; }
    .head { fill: var(--ink); }
    text { font-family: var(--font-mono); }
  </style>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1104" height="526" class="ink"/>
  <rect x="48" y="48" width="1104" height="526" class="box"/>

  <text x="96" y="104" font-size="28" class="mute">backend.how</text>
  <text x="96" y="176" font-size="52" font-weight="800" class="ink">The Psychology of Seeking Help</text>

  <!-- two first messages about the same failing test (samples from Fig. 1);
       purple underline = the phrase that shows the type. 28 px mono = 16.8 px per char -->
  <g font-size="28">
    <rect x="96" y="222" width="650" height="84" class="msg"/>
    <text x="120" y="274" class="ink">tests are broken, can someone look?</text>
    <line x1="422" y1="286" x2="708" y2="286" class="clue"/>

    <rect x="96" y="338" width="650" height="84" class="msg"/>
    <text x="120" y="390" class="ink">docker ps shows no db container.</text>
    <line x1="120" y1="402" x2="642" y2="402" class="clue"/>
  </g>

  <!-- message -> type -->
  <line x1="758" y1="264" x2="800" y2="264" class="arr"/>
  <path d="M814 264 l-16 -9 v18 z" class="head"/>
  <line x1="758" y1="380" x2="800" y2="380" class="arr"/>
  <path d="M814 380 l-16 -9 v18 z" class="head"/>

  <g font-size="28" font-weight="800" class="ink">
    <text x="830" y="274">Direct Seeker</text>
    <text x="830" y="372">Persistent</text>
    <text x="830" y="408">Problem Solver</text>
  </g>

  <text x="96" y="500" font-size="28" class="ink">The first message shows how much they tried.</text>
</svg>
