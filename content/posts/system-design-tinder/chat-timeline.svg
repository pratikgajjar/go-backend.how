<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="ui-monospace, Menlo, Consolas, monospace">
<rect width="960" height="380" fill="#fefcfc"/>
<rect x="12" y="20" width="170" height="300" fill="#fefcfc" stroke="#2a1c1e" stroke-width="2"/>
<rect x="72" y="30" width="50" height="5" fill="#2a1c1e"/>
<text x="97" y="56" font-size="13" font-weight="750" fill="#2a1c1e" text-anchor="middle">Arjun</text>
<line x1="24" x2="170" y1="64" y2="64" stroke="#e3d3d5"/>
<text x="97" y="80" font-size="10.5" font-weight="400" fill="#2a1c1e" text-anchor="middle"></text>
<rect x="30" y="236" width="140" height="58" fill="#fefcfc" stroke="#2a1c1e" stroke-width="1.5"/>
<text x="40" y="256" font-size="12" font-weight="400" fill="#2a1c1e" text-anchor="start">Hi Riya! Coffee</text>
<text x="40" y="272" font-size="12" font-weight="400" fill="#2a1c1e" text-anchor="start">on Sunday?</text>
<text x="160" y="288" font-size="10.5" font-weight="700" fill="#1d7a4c" text-anchor="end">✓✓ delivered</text>
<rect x="778" y="20" width="170" height="300" fill="#fefcfc" stroke="#2a1c1e" stroke-width="2"/>
<rect x="838" y="30" width="50" height="5" fill="#2a1c1e"/>
<text x="863" y="56" font-size="13" font-weight="750" fill="#2a1c1e" text-anchor="middle">Riya</text>
<line x1="790" x2="936" y1="64" y2="64" stroke="#e3d3d5"/>
<text x="863" y="80" font-size="10.5" font-weight="400" fill="#2a1c1e" text-anchor="middle">online · new socket</text>
<rect x="792" y="236" width="140" height="44" fill="#f2e4e6"/>
<text x="802" y="254" font-size="12" font-weight="400" fill="#2a1c1e" text-anchor="start">Hi Riya! Coffee</text>
<text x="802" y="270" font-size="12" font-weight="400" fill="#2a1c1e" text-anchor="start">on Sunday?</text>
<rect x="200" y="20" width="560" height="28" fill="#f9f1f2"/>
<text x="212" y="38" font-size="11" font-weight="700" fill="#2a1c1e" text-anchor="start">0 ms</text>
<text x="262" y="38" font-size="12" font-weight="400" fill="#2a1c1e" text-anchor="start">Arjun’s phone sends the message</text>
<rect x="200" y="52" width="560" height="40" fill="#f9f1f2"/>
<text x="212" y="70" font-size="11" font-weight="700" fill="#2a1c1e" text-anchor="start">3 ms</text>
<text x="262" y="70" font-size="12" font-weight="700" fill="#1d7a4c" text-anchor="start">gateway A stores the row first</text>
<text x="262" y="85" font-size="10.5" font-weight="400" fill="#2a1c1e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">INSERT … status = &#x27;pending&#x27;</text>
<rect x="200" y="96" width="560" height="40" fill="#fbe1dd"/>
<text x="212" y="114" font-size="11" font-weight="700" fill="#2a1c1e" text-anchor="start">4 ms</text>
<text x="262" y="114" font-size="12" font-weight="700" fill="#c23a2c" text-anchor="start">gateway A publishes; no subscriber</text>
<text x="262" y="129" font-size="10.5" font-weight="400" fill="#2a1c1e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">PUBLISH user:riya … → (integer) 0</text>
<rect x="200" y="140" width="560" height="40" fill="#f9f1f2"/>
<text x="212" y="158" font-size="11" font-weight="700" fill="#2a1c1e" text-anchor="start">5 s</text>
<text x="262" y="158" font-size="12" font-weight="400" fill="#2a1c1e" text-anchor="start">gateway A: no ACK, queues a push</text>
<text x="262" y="173" font-size="10.5" font-weight="400" fill="#2a1c1e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">push_queue.publish(…)</text>
<rect x="200" y="184" width="560" height="28" fill="#f9f1f2"/>
<text x="212" y="202" font-size="11" font-weight="700" fill="#2a1c1e" text-anchor="start">5.3 s</text>
<text x="262" y="202" font-size="12" font-weight="400" fill="#2a1c1e" text-anchor="start">APNs / FCM shows a notification</text>
<rect x="200" y="216" width="560" height="40" fill="#f9f1f2"/>
<text x="212" y="234" font-size="11" font-weight="700" fill="#2a1c1e" text-anchor="start">9 s</text>
<text x="262" y="234" font-size="12" font-weight="400" fill="#2a1c1e" text-anchor="start">Riya’s phone opens the app and syncs</text>
<text x="262" y="249" font-size="10.5" font-weight="400" fill="#2a1c1e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">SELECT … WHERE message_id &gt; minTimeuuid(…)</text>
<rect x="200" y="260" width="560" height="40" fill="#f9f1f2"/>
<text x="212" y="278" font-size="11" font-weight="700" fill="#2a1c1e" text-anchor="start">9.1 s</text>
<text x="262" y="278" font-size="12" font-weight="700" fill="#1d7a4c" text-anchor="start">Riya’s phone ACKs; row is delivered</text>
<text x="262" y="293" font-size="10.5" font-weight="400" fill="#2a1c1e" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">UPDATE … status = &#x27;delivered&#x27;</text>
<text x="480" y="360" font-size="11.5" font-weight="600" fill="#2a1c1e" text-anchor="middle">Fault: gateway B restarts. The live path drops the message; the sync query reads it from the stored row.</text>
</svg>
