<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    .ink { fill: var(--ink); } .mute { fill: var(--mute); }
    .box { fill: var(--board); stroke: var(--ink); stroke-width: 2.5; }
    .data { fill: var(--brown-l); stroke: var(--brown); stroke-width: 2.5; stroke-dasharray: 8 6; }
    .safe { fill: var(--green-l); stroke: var(--green); stroke-width: 2.5; }
    .arr { stroke: var(--ink); stroke-width: 2.5; }
    text { font-family: var(--font-mono); }
  </style>
  <!-- sheet with hard shadow -->
  <rect x="56" y="56" width="1104" height="526" class="ink"/>
  <rect x="48" y="48" width="1104" height="526" class="box"/>

  <text x="96" y="168" font-size="60" font-weight="800" class="ink">backend.how</text>
  <text x="96" y="226" font-size="34" font-weight="600" class="ink">Backend systems from first principles</text>

  <!-- one write, followed from the API down to the disk -->
  <g font-size="30" font-weight="700" text-anchor="middle">
    <rect x="96" y="300" width="210" height="96" class="box"/><text x="201" y="358" class="ink">API</text>
    <rect x="362" y="300" width="210" height="96" class="box"/><text x="467" y="358" class="ink">Postgres</text>
    <rect x="628" y="300" width="210" height="96" class="data"/><text x="733" y="358" fill="var(--brown)">WAL</text>
    <rect x="894" y="300" width="210" height="96" class="safe"/><text x="999" y="358" fill="var(--green)">disk</text>
  </g>
  <g>
    <line x1="306" y1="348" x2="350" y2="348" class="arr"/><path d="M360 348 l-14 -8 v16 z" class="ink"/>
    <line x1="572" y1="348" x2="616" y2="348" class="arr"/><path d="M626 348 l-14 -8 v16 z" class="ink"/>
    <line x1="838" y1="348" x2="882" y2="348" class="arr"/><path d="M892 348 l-14 -8 v16 z" class="ink"/>
  </g>
  <text x="999" y="440" font-size="28" text-anchor="middle" fill="var(--green)">fsync</text>

  <text x="96" y="512" font-size="32" font-weight="600" class="ink">One write, followed down to the disk.</text>
</svg>
