{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" -}}
{{- $width := .Get "width" -}}
{{- $caption := .Get "caption" -}}
{{- $downloadURL := .Get "download" -}}

{{ with .Page.Resources.GetMatch $src }}
  {{ $image := . }}
  <figure style="max-width: 100%; margin: 0 auto;">
    {{ if eq .MediaType.SubType "svg" }}
      <!-- For SVG, just load normally -->
      <img src="{{ $image.RelPermalink }}"
           alt="{{ $alt }}"
           loading="lazy"
           style="display: block; width: 100%; height: auto;">
    {{ else }}
      <!-- Resize the full-res image -->
      {{ $resized := $image.Resize (printf "%dx%d webp" .Width .Height) }}
      <!-- Create a blurred placeholder -->
      {{ $blurImg := $image.Resize "800x q50 webp" | images.Filter (images.GaussianBlur 6) }}

      <!-- Container holds the blurred placeholder as a background so it never
           appears as a second <img> (e.g. in Safari Reader mode, which strips
           the inline opacity/positioning that normally hides it). -->
      <div class="image-frame" style="position: relative; width: 100%; overflow: hidden; padding-bottom: calc(100% * {{ $resized.Height }} / {{ $resized.Width }}); background-image: url('{{ $blurImg.RelPermalink }}'); background-size: cover; background-position: center;">
        <!-- Full resolution image, fades in over the blurred background -->
        <img src="{{ $resized.RelPermalink }}"
             alt="{{ $alt }}"
             loading="lazy"
             class="lazyload-image"
             style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 0.6s ease-out; opacity: 0;">
      </div>
    {{ end }}

    {{ with $caption }}
      <figcaption>{{ . }}</figcaption>
    {{ end }}

    {{ with $downloadURL }}
      <div><a href="{{ $image.RelPermalink }}" download>Download</a></div>
    {{ end }}
  </figure>
{{ end }}
