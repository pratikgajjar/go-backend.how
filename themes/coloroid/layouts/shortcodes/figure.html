{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" -}}
{{- $width := .Get "width" -}}
{{- $caption := .Get "caption" -}}
{{- $downloadURL := .Get "download" -}}

{{ with .Page.Resources.GetMatch $src }}
  {{ $image := . }}
  <figure style="max-width: 100%; margin: 0 auto;">
    {{ if eq .MediaType.SubType "svg" }}
      <!-- For SVG, just load normally -->
      <img src="{{ $image.RelPermalink }}"
           alt="{{ $alt }}"
           loading="lazy"
           style="display: block; width: 100%; height: auto;">
    {{ else }}
      <!-- Resize the full-res image -->
      {{ $resized := $image.Resize (printf "%dx%d webp" .Width .Height) }}
      <!-- Create a blurred placeholder -->
      {{ $blurImg := $image.Resize "800x q50 webp" | images.Filter (images.GaussianBlur 6) }}

      <!-- Container shows the blurred placeholder as a CSS background so it
           never renders as a second <img> (e.g. in Safari Reader mode). The
           full image sits on top and fades in. Styling: .image-frame in CSS;
           only aspect-ratio + blur URL vary per image. -->
      <div class="image-frame" style="aspect-ratio: {{ $resized.Width }} / {{ $resized.Height }}; background-image: url('{{ $blurImg.RelPermalink }}');">
        <img src="{{ $resized.RelPermalink }}" alt="{{ $alt }}" loading="lazy" class="lazyload-image">
      </div>
    {{ end }}

    {{ with $caption }}
      <figcaption>{{ . }}</figcaption>
    {{ end }}

    {{ with $downloadURL }}
      <div><a href="{{ $image.RelPermalink }}" download>Download</a></div>
    {{ end }}
  </figure>
{{ end }}
